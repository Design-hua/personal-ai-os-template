function wireHomeChat(){
  const sendBtn = $("#homeChatSend");
  const input = $("#homeChatInput");
  const list = $("#homeChatList");
  const viewCogBtn = $("#homeViewCogBtn");

  // 注入图标
  $("#homeChatIcon") && ($("#homeChatIcon").innerHTML = icon("bolt", 17));
  sendBtn.innerHTML = icon("plus", 14) + "发送";
  if(viewCogBtn){
    viewCogBtn.innerHTML = icon("star", 13) + "AI 助手";
    viewCogBtn.onclick = () => window.openCog && window.openCog();
  }

  function autoResize(){
    input.style.height = "auto";
    input.style.height = Math.min(120, input.scrollHeight) + "px";
  }
  input.addEventListener("input", () => {
    autoResize();
    sendBtn.disabled = !input.value.trim();
  });
  input.addEventListener("keydown", e => {
    // IME 组合输入（中文输入法候选上屏）时不拦截
    if(e.isComposing || e.keyCode === 229) return;
    // Enter 发送；Shift+Enter 换行（走浏览器默认行为）
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      homeSend();
    }
  });
  sendBtn.onclick = homeSend;

  // ==== 首页聊天 · 语音对话：🎙 录音 → /api/ask/voice → 浏览器朗读回复 ====
  const micBtn = $("#homeChatMic");
  micBtn.textContent = "🎙";

  function chatSessionId(){
    let s = localStorage.getItem("aiChatSession");
    if(!s){
      s = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      localStorage.setItem("aiChatSession", s);
    }
    return s;
  }
  function speak(text){
    if(localStorage.getItem("aiSpeak") === "off" || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      speechSynthesis.speak(u);
    }catch(e){}
  }

  let mediaStream = null, recorder = null, chunks = [], recording = false, recordingMsg = null;
  micBtn.onclick = async () => {
    if(recording){
      recording = false;
      micBtn.textContent = "🎙"; micBtn.style.background = "";
      if(recordingMsg){ recordingMsg.remove(); recordingMsg = null; }
      try{ recorder.stop(); }catch(e){}
      mediaStream.getTracks().forEach(t => t.stop());
      return;
    }
    if(!navigator.mediaDevices || !window.MediaRecorder){
      addMsg("error", "此环境不支持录音：需 Chrome/Edge，且页面为 localhost 或已在 chrome://flags 放行", "提示");
      return;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }catch(e){
      addMsg("error", "麦克风权限被拒绝：请在浏览器地址栏的权限请求里允许麦克风", "提示");
      return;
    }
    chunks = [];
    const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
    recorder = new MediaRecorder(mediaStream, mime ? { mimeType: mime } : undefined);
    recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: mime || "audio/webm" });
      if(blob.size < 2000){ addMsg("error", "录音太短，没收到声音", "提示"); return; }
      const thinking = addMsg("loading", "语音识别中…");
      try{
        const resp = await fetch(AI_API_BASE + "/api/ask/voice", {
          method: "POST",
          headers: { "Content-Type": blob.type || "audio/webm", "X-Chat-Session": chatSessionId() },
          body: blob,
        });
        const data = await resp.json();
        thinking.remove();
        if(!data.ok){ addMsg("error", data.error || "识别失败", "提示"); return; }
        addMsg("user", data.userText, "我说");
        if(data.mode === "saved"){
          let body = `已保存为「${data.type}」\n标题：${data.title}`;
          if(data.profileUpdated) body += `\n认知条目：+${data.profileItems} 条`;
          addMsg("saved", body, "记录已存");
          speak(`已保存为${data.type}，标题，${data.title}`);
        } else {
          addMsg("assistant", data.reply || "(空)", data.mode === "answer" ? "AI 回答" : "AI");
          speak(data.reply || "");
          homeAIHistory.push({ role: "user", content: data.userText });
          homeAIHistory.push({ role: "assistant", content: data.reply || "" });
          if(homeAIHistory.length > 20) homeAIHistory.splice(0, homeAIHistory.length - 20);
        }
      }catch(e){
        thinking.remove();
        addMsg("error", "语音服务连接失败，请确认服务已启动", "连接失败");
      }
    };
    recorder.start();
    recording = true;
    micBtn.textContent = "⏹";
    micBtn.style.background = "#e5484d";
    recordingMsg = addMsg("loading", "🎙 录音中…说完再点一下结束");
  };

  function addMsg(kind, text, tag, opts){
    opts = opts || {};
    const empty = list.querySelector(".chat-empty");
    if(empty) empty.remove();
    const div = document.createElement("div");
    div.className = "chat-msg " + kind;
    if(tag){ const t = document.createElement("span"); t.className="tag"; t.textContent = tag; div.appendChild(t); }
    if(opts.quote){
      const qb = document.createElement("div");
      qb.className = "chat-quote-block";
      qb.textContent = "「" + (opts.quote.length > 80 ? opts.quote.slice(0, 80) + "…" : opts.quote) + "」";
      div.appendChild(qb);
    }
    const body = document.createElement("div"); body.textContent = text; div.appendChild(body);
    if(opts.ts){
      const tm = document.createElement("span");
      tm.className = "chat-time";
      tm.textContent = fmtChatTime(opts.ts);
      div.appendChild(tm);
    }
    // 长按（触屏）/右键（电脑）→ 引用该条继续聊
    if(kind === "user" || kind === "assistant" || kind === "saved") wireQuote(div, text, opts.quote);
    if(opts.prepend){
      list.insertBefore(div, list.firstChild);
    } else {
      list.appendChild(div);
      list.scrollTop = list.scrollHeight;
    }
    return div;
  }
  window._chatAddMsg = addMsg;

  function fmtChatTime(ts){
    const d = new Date(ts);
    const p = (n) => (n < 10 ? "0" + n : "" + n);
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // ==== 长按消息 → 引用该段继续聊（触屏长按 500ms / 电脑右键） ====
  const quoteBar = $("#homeChatQuoteBar");
  const quoteTextEl = $("#homeChatQuoteText");
  function setQuote(display, content){
    homeQuoted = { display, content };
    if(quoteBar && quoteTextEl){
      quoteTextEl.textContent = "引用：" + (display.length > 60 ? display.slice(0, 60) + "…" : display);
      quoteBar.style.display = "flex";
    }
  }
  function clearQuote(){
    homeQuoted = null;
    if(quoteBar) quoteBar.style.display = "none";
  }
  const quoteRemoveBtn = $("#homeChatQuoteRemove");
  if(quoteRemoveBtn) quoteRemoveBtn.onclick = clearQuote;

  function wireQuote(el, text, quote){
    if(!el) return;
    // 引用带引用块的旧消息时，把原引用一起带上，AI 上下文才完整
    const content = quote ? "[引用]「" + quote + "」\n" + text : text;
    let timer = null;
    const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
    const trigger = () => setQuote(text, content);
    el.addEventListener("contextmenu", (e) => { e.preventDefault(); trigger(); });
    el.addEventListener("touchstart", () => { timer = setTimeout(() => { timer = null; trigger(); }, 500); }, { passive: true });
    el.addEventListener("touchmove", cancel, { passive: true });
    el.addEventListener("touchend", cancel);
    el.addEventListener("touchcancel", cancel);
  }

  // ==== 历史记录：打开时加载最近50条，可继续往前翻 ====
  let chatLoadedCount = 0;
  let chatTotalCount = 0;
  let chatLoadingMore = false;

  function renderHistoryMsg(m, prepend){
    const kind = m.kind === "saved" ? "saved" : (m.role === "user" ? "user" : "assistant");
    const tag = kind === "user" ? "我" : (kind === "saved" ? "记录已存" : "AI");
    return addMsg(kind, m.text || "", tag, { prepend, quote: m.quote, ts: m.ts });
  }

  function renderLoadMoreBtn(){
    let btn = list.querySelector(".chat-load-more");
    const remain = chatTotalCount - chatLoadedCount;
    if(remain <= 0){ if(btn) btn.remove(); return; }
    if(!btn){
      btn = document.createElement("button");
      btn.className = "chat-load-more";
      btn.onclick = loadMoreHistory;
      list.insertBefore(btn, list.firstChild);
    }
    btn.textContent = "↑ 加载更早的消息（还有 " + remain + " 条）";
  }

  async function loadMoreHistory(){
    if(chatLoadingMore) return;
    chatLoadingMore = true;
    const btn = list.querySelector(".chat-load-more");
    if(btn) btn.disabled = true;
    try {
      const r = await fetch(AI_API_BASE + "/api/chat/history?limit=50&skip=" + chatLoadedCount);
      const d = await r.json();
      if(d.ok && Array.isArray(d.messages) && d.messages.length){
        const hBefore = list.scrollHeight, sBefore = list.scrollTop;
        for(let i = d.messages.length - 1; i >= 0; i--) renderHistoryMsg(d.messages[i], true);
        chatLoadedCount += d.messages.length;
        list.scrollTop = sBefore + (list.scrollHeight - hBefore);
        renderLoadMoreBtn();
      } else if(btn){
        btn.disabled = false;
      }
    } catch(e){
      if(btn) btn.disabled = false;
    }
    chatLoadingMore = false;
  }

  (async function loadChatHistory(){
    try {
      const r = await fetch(AI_API_BASE + "/api/chat/history?limit=50");
      const d = await r.json();
      if(d.ok && Array.isArray(d.messages) && d.messages.length){
        chatTotalCount = d.total || d.messages.length;
        d.messages.forEach((m) => renderHistoryMsg(m, false));
        chatLoadedCount = d.messages.length;
        renderLoadMoreBtn();
        // 重建多轮上下文：最近20条 user/assistant（记录卡不进上下文）
        homeAIHistory = d.messages
          .filter((m) => m.kind !== "saved" && (m.role === "user" || m.role === "assistant") && m.text)
          .slice(-20)
          .map((m) => ({ role: m.role, content: m.role === "user" && m.quote ? "[引用]「" + m.quote + "」\n" + m.text : m.text }));
      }
    } catch(e){ /* 历史加载失败不影响新聊天 */ }
  })();

  // 研究产出落库：把思考伙伴回答存进飞书「知识资料」表（后端按内容哈希幂等，重复保存跳过）
  function addResearchBtn(div, question, reply){
    if(!div || !reply) return;
    const btn = document.createElement("button");
    btn.textContent = "💾 存为研究资料";
    btn.style.cssText = "margin-top:6px;margin-right:6px;padding:2px 8px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-tertiary);cursor:pointer";
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "保存中…";
      try{
        const resp = await fetch(AI_API_BASE + "/api/thinking/save-research", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question || "", reply })
        });
        const d = await resp.json();
        if(d.ok) btn.textContent = d.duplicated ? "已在知识资料中" : "✅ 已存入知识资料";
        else { btn.textContent = "💾 存为研究资料（" + (d.error || "失败") + "）"; btn.disabled = false; }
      }catch(e){ btn.textContent = "💾 存为研究资料"; btn.disabled = false; }
    };
    div.appendChild(btn);
  }

  async function homeSend(){
    if(homeChatSending) return;
    const text = input.value.trim();
    if(!text) return;
    homeChatSending = true;
    sendBtn.disabled = true;
    const q = homeQuoted;
    input.value = ""; autoResize();
    clearQuote();
    addMsg("user", text, "我", q ? { quote: q.display } : undefined);
    // 引用内容拼进对话上下文给 AI；正文单独传后端，分类/存档不被引用污染
    homeAIHistory.push({ role: "user", content: q ? q.content : text });
    if(homeAIHistory.length > 20) homeAIHistory.splice(0, homeAIHistory.length - 20);
    const loading = addMsg("loading", "思考中…");

    try {
      // 统一走 /api/input：后端 classify 三分支（记录/提问/对话）自动判断
      const resp = await fetch(AI_API_BASE + "/api/input", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, history: homeAIHistory, quote: q ? q.content : undefined }),
      });
      const data = await resp.json();
      loading.remove();
      if(!data.ok){
        addMsg("error", data.error || "请求失败", "错误");
        homeAIHistory.pop();
        return;
      }
      if(data.mode === "chat"){
        // 视频收录回执：渲染评价卡片；其他对话回应：不存，AI 接话
        if(data.video){
          renderVideoReceipt(data.reply || "(空)", data.video);
        }else{
          const dv = addMsg("assistant", data.reply || "(空)", "AI");
          if(data.researchable) addResearchBtn(dv, data.research && data.research.question, (data.research && data.research.reply) || data.reply);
        }
        if(data.meetingFlow){
          const fc = buildMeetingFlowCard(data.meetingFlow, AI_API_BASE, (t)=>{ input.value=t; input.focus(); });
          if(fc){ list.appendChild(fc); list.scrollTop = list.scrollHeight; }
        }
        if(data.breakdown){
          const bc = buildBreakdownCard(data.breakdown, AI_API_BASE);
          if(bc){ list.appendChild(bc); list.scrollTop = list.scrollHeight; }
        }
        homeAIHistory.push({ role: "assistant", content: data.reply || "" });
      } else if(data.mode === "answer"){
        // 提问：读上下文回答，不存
        const dv = addMsg("assistant", data.reply || "(空回答)", "AI 回答");
        if(data.researchable) addResearchBtn(dv, data.research && data.research.question, (data.research && data.research.reply) || data.reply);
        homeAIHistory.push({ role: "assistant", content: data.reply || "" });
      } else if(data.mode === "saved"){
        // 记录：存盘 + 认知条目+1 + 自动提取待办
        let body = `已保存为「${data.type}」\n标题：${data.title}\n目录：${data.dir}`;
        if(data.profileUpdated) body += `\n认知条目：+${data.profileItems} 条`;
        addMsg("saved", body, "记录已存" + (data.profileUpdated ? " · 认知+" + data.profileItems : ""));

        try {
          const er = await fetch(AI_API_BASE + "/api/extract-todos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          const ed = await er.json();
          if(ed.ok && ed.todos && ed.todos.length > 0){
            const m = CONFIG.modules.find(x => x.type === "todo");
            const key = m ? m.key : "todo";
            data[key] = data[key] || [];
            for(const t of ed.todos){
              data[key].push({
                id: Date.now() + Math.floor(Math.random()*10000),
                title: t.text,
                priority: t.priority || "P2",
                done: false,
                note: ""
              });
            }
            store.save();
            addMsg("saved", `+${ed.todos.length} 条待办已自动加入「今日计划」。\n切到「今日计划」模块查看。`,
              "AI 助手 · 自动提取");
          }
        } catch(ex){
          // 提取失败静默
        }
      }
      if(homeAIHistory.length > 20) homeAIHistory.splice(0, homeAIHistory.length - 20);
    } catch(e){
      loading.remove();
      addMsg("error", "无法连接 " + AI_API_BASE + " — 请确认 personal-ai-os 已启动 (cd personal-ai-os && npm start)", "连接失败");
      homeAIHistory.pop();
    } finally {
      homeChatSending = false;
      sendBtn.disabled = !input.value.trim();
      input.focus();
    }
  }

  // ==== 视频评价：收录后下一条消息即评价；@ 或「换一条」选其他视频；回执卡片可随时点「评价这条」 ====
  let commentTarget = null;
  const commentChip = $("#homeCommentChip");
  const commentTitleEl = $("#homeCommentTitle");
  const videoPicker = $("#homeVideoPicker");

  function setCommentTarget(t){
    if(!t || (!t.url && !t.recordId)) return;
    commentTarget = t;
    if(commentTitleEl) commentTitleEl.textContent = t.title || "这条视频";
    if(commentChip) commentChip.style.display = "flex";
    if(videoPicker) videoPicker.style.display = "none";
    input.placeholder = "写下你的评价，直接发送…（点右侧✕恢复正常聊天）";
    input.focus();
  }
  function clearCommentTarget(){
    commentTarget = null;
    if(commentChip) commentChip.style.display = "none";
    if(videoPicker) videoPicker.style.display = "none";
    input.placeholder = "说点什么… Enter 发送，Shift+Enter 换行";
  }
  $("#homeCommentCancel").onclick = clearCommentTarget;
  $("#homeCommentSwitch").onclick = () => openVideoPicker();

  async function openVideoPicker(){
    if(!videoPicker) return;
    videoPicker.style.display = "block";
    videoPicker.innerHTML = '<div style="padding:14px;text-align:center;font-size:12px;color:var(--ink-muted)">加载中…</div>';
    try{
      const resp = await fetch(AI_API_BASE + "/api/videos/recent?limit=8");
      const d = await resp.json();
      const items = (d && d.items) || [];
      if(!items.length){
        videoPicker.innerHTML = '<div style="padding:14px;text-align:center;font-size:12px;color:var(--ink-muted)">表格里还没有视频，先收录一条吧</div>';
        return;
      }
      let html = '<div style="padding:8px 12px;font-size:11px;color:var(--ink-muted);border-bottom:1px solid var(--border)">选择要评价的视频</div>';
      items.forEach((it, i) => {
        const t = String(it.title || "未命名").replace(/[<>&"]/g, s => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[s]));
        const tag = it.cluster ? `<span style="font-size:10px;color:#2b5cb8;background:#eef4ff;border-radius:4px;padding:1px 5px;margin-left:6px">${it.cluster}</span>` : "";
        html += `<div data-pi="${i}" style="padding:10px 12px;font-size:12.5px;border-bottom:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer">${t}${tag}</div>`;
      });
      videoPicker.innerHTML = html;
      videoPicker.querySelectorAll("[data-pi]").forEach((el) => {
        el.onclick = () => {
          const it = items[Number(el.getAttribute("data-pi"))];
          setCommentTarget({ url: it.url, recordId: it.recordId, title: it.title });
        };
      });
    }catch(e){
      videoPicker.innerHTML = '<div style="padding:14px;text-align:center;font-size:12px;color:#c0392b">加载失败：' + String(e.message || e) + '</div>';
    }
  }

  input.addEventListener("input", () => {
    const v = input.value;
    if(/@\s*$/.test(v)){
      input.value = v.replace(/@\s*$/, "");
      autoResize();
      openVideoPicker();
    }
  });

  async function sendVideoComment(text){
    homeChatSending = true;
    sendBtn.disabled = true;
    input.value = ""; autoResize();
    addMsg("user", text, "我的评价");
    const target = commentTarget;
    const loading = addMsg("loading", "写入评价…");
    try{
      const resp = await fetch(AI_API_BASE + "/api/videos/comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: target.url, recordId: target.recordId, text }),
      });
      const d = await resp.json();
      loading.remove();
      if(!d.ok){
        addMsg("error", d.error || "评价写入失败", "错误");
      }else{
        addMsg("saved", `✅ 评价已记录到《${d.title || target.title || "视频"}》，飞书表「我的评价」列可查看。`, "评价已存");
        clearCommentTarget();
      }
    }catch(e){
      loading.remove();
      addMsg("error", "无法连接服务，评价未保存", "错误");
    }finally{
      homeChatSending = false;
      sendBtn.disabled = !input.value.trim();
      input.focus();
    }
  }

  function renderVideoReceipt(text, video){
    const div = addMsg("assistant", text, "视频收录");
    if(video && (video.url || video.recordId)){
      const btn = document.createElement("button");
      btn.textContent = "💬 评价这条";
      btn.style.cssText = "margin-top:6px;margin-right:6px;padding:2px 10px;font-size:11px;border:1px solid #c7dbff;border-radius:6px;background:#eef4ff;color:#2b5cb8;cursor:pointer";
      btn.onclick = () => setCommentTarget({ url: video.url || "", recordId: video.recordId || "", title: video.title || "这条视频" });
      div.appendChild(btn);
      setCommentTarget({ url: video.url || "", recordId: video.recordId || "", title: video.title || "这条视频" });
    }
    return div;
  }

  // ============ 快捷指令面板（⚡）：点按钮→填前缀或拉列表点选，零后端改动 ============
  // 命令清单与 lib/router.js 各 handle*Command 正则一一对应
  (function(){
    let overlay = null;
    const CSS = '.qc-mask{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:900;display:flex;align-items:flex-end;justify-content:center}'
      + '.qc-panel{background:#fff;border-radius:16px 16px 0 0;max-width:520px;width:100%;max-height:72vh;overflow-y:auto;padding:14px 14px 20px;box-sizing:border-box}'
      + '.qc-title{font-size:13px;color:#667;font-weight:600;margin:2px 2px 10px}'
      + '.qc-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid #e5eaf2;background:#f8fafd;border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:14px;color:#123;box-sizing:border-box}'
      + '.qc-item:hover{background:#eef4ff}.qc-item b{font-size:14px}.qc-item i{display:block;font-style:normal;font-size:12px;color:#889;margin-top:2px}'
      + '.qc-ico{font-size:18px;flex:none}.qc-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}'
      + '.qc-chip{border:1px solid #c9d8f2;background:#fff;color:#2b5cb8;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}'
      + '.qc-chip:hover{background:#eef4ff}.qc-back{border:none;background:none;color:#2b5cb8;font-size:13px;cursor:pointer;padding:0 2px;margin-bottom:8px}'
      + '.qc-empty{font-size:13px;color:#889;padding:6px 2px}';
    if (!document.getElementById('qcStyle')) {
      const s = document.createElement('style'); s.id = 'qcStyle'; s.textContent = CSS; document.head.appendChild(s);
    }
    function close() { if (overlay) { overlay.remove(); overlay = null; } }
    function esc(t) { return String(t).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function open(input) {
      close();
      overlay = document.createElement('div');
      overlay.className = 'qc-mask';
      overlay.onclick = (e) => { if (e.target === overlay) close(); };
      const panel = document.createElement('div');
      panel.className = 'qc-panel';
      overlay.appendChild(panel);
      function fill(text) { input.value = text; input.focus(); try { input.setSelectionRange(text.length, text.length); } catch (e) {} close(); }
      function row(ico, title, sub, onClick) {
        const b = document.createElement('button');
        b.className = 'qc-item';
        b.innerHTML = '<span class="qc-ico">' + ico + '</span><span><b>' + title + '</b>' + (sub ? '<i>' + sub + '</i>' : '') + '</span>';
        b.onclick = onClick;
        panel.appendChild(b);
      }
      function menuHome() {
        panel.innerHTML = '<div class="qc-title">⚡ 快捷指令 <span style="color:#aab;font-weight:400">（点选后自动填入，补完内容按 Enter 发送）</span></div>';
        row('🔍', '想学东西', '研究快讯 / 深度研究 / 两样对比', menuStudy);
        row('📋', '拆任务：项目', '把项目拆成带验收标准的任务', menuProjects);
        row('⚖️', '立项：已拍板的决策', '决策卡转项目卡', menuDecisions);
        row('🧠', '记经验', '把感悟存进经验卡', () => fill('记经验：'));
        row('📚', '书卡', '查开放书库 + AI 拆书卡', () => fill('书卡：'));
        row('📖', '命令速查', '忘了都有什么命令？', () => fill('帮助'));
      }
      function withBack(title, backFn) {
        panel.innerHTML = '<button class="qc-back">‹ 返回</button><div class="qc-title">' + title + '</div>';
        panel.querySelector('.qc-back').onclick = backFn;
      }
      function menuStudy() {
        withBack('🔍 想学东西', menuHome);
        row('⚡', '研究快讯', '快速了解一个话题', () => fill('研究快讯：'));
        row('🔬', '深度研究', '深入分析（可存知识库）', () => fill('研究：'));
        row('⚖️', '对比研究', '两样东西对比', () => fill('对比：A vs B'));
      }
      function chips(list) {
        const wrap = document.createElement('div');
        wrap.className = 'qc-chips';
        list.forEach((x) => {
          const c = document.createElement('button');
          c.className = 'qc-chip';
          c.textContent = x.label;
          c.onclick = () => fill(x.fill);
          wrap.appendChild(c);
        });
        panel.appendChild(wrap);
      }
      async function menuProjects() {
        withBack('📋 拆任务：选一个项目', menuHome);
        const tip = document.createElement('div'); tip.className = 'qc-empty'; tip.textContent = '加载项目列表…'; panel.appendChild(tip);
        try {
          const r = await fetch('/api/projects/list').then((x) => x.json());
          const items = (r.items || r.projects || []).filter((p) => p.name);
          tip.remove();
          if (!items.length) { tip.textContent = '还没有项目卡。可以先发「决策：要不要做X」尽调拍板，或「新建项目：名称」。'; panel.appendChild(tip); return; }
          chips(items.slice(0, 30).map((p) => ({ label: String(p.name).slice(0, 22), fill: '拆任务：' + p.name })));
        } catch (e) { tip.textContent = '项目列表加载失败：' + e.message; }
      }
      async function menuDecisions() {
        withBack('⚖️ 立项：选已拍板的决策', menuHome);
        const tip = document.createElement('div'); tip.className = 'qc-empty'; tip.textContent = '加载决策卡…'; panel.appendChild(tip);
        try {
          const r = await fetch('/api/decisions/list').then((x) => x.json());
          const items = (r.items || r.decisions || []).filter((d) => String(d.status || '').includes('✅') && d.question);
          tip.remove();
          if (!items.length) { tip.textContent = '还没有 ✅决定做 的决策卡。先发「决策：要不要做X」做尽调，拍板后再来立项。'; panel.appendChild(tip); return; }
          chips(items.slice(0, 30).map((d) => ({ label: String(d.question).slice(0, 22), fill: '立项：' + d.question })));
        } catch (e) { tip.textContent = '决策卡加载失败：' + e.message; }
      }
      menuHome();
      document.body.appendChild(overlay);
    }
    function bind(btnId, inputId) {
      const btn = document.getElementById(btnId), input = document.getElementById(inputId);
      if (btn && input) btn.onclick = () => (overlay ? close() : open(input));
    }
    bind('homeChatQuick', 'homeChatInput');
    bind('aiQuick', 'aiInput');
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  })();

  // 最外层拦截：挂着评价目标时，文字消息走评价接口（function 声明可重新赋值，keydown 里的 homeSend() 同步生效）
  const _prevHomeSend = homeSend;
  homeSend = function(){
    if(homeChatSending) return;
    if(commentTarget){
      const t = input.value.trim();
      if(t) return sendVideoComment(t);
      return;
    }
    return _prevHomeSend.apply(this, arguments);
  };
  sendBtn.onclick = homeSend;

  // ==== 图片输入：🖼 选图 → /api/input/image 识别 → 复用渲染分支 ====
  const imgBtn = $("#homeChatImage");
  const imgInput = $("#homeChatImageInput");
  if(imgBtn && imgInput){
    imgBtn.onclick = () => imgInput.click();
    imgInput.onchange = async (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      if(homeChatSending) return;
      homeChatSending = true;
      const loading = addMsg("loading", "识别图片中…");
      let base64 = "";
      try {
        base64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result || "").split(",")[1] || "");
          r.onerror = () => rej(new Error("读文件失败"));
          r.readAsDataURL(file);
        });
      } catch(err){
        loading.remove();
        addMsg("error", "读取图片失败：" + err.message, "错误");
        homeChatSending = false;
        imgInput.value = "";
        return;
      }
      try {
        const kind = imgInput.dataset.kind || '';
        imgInput.dataset.kind = '';
        if(kind === 'calendar'){
          const resp = await fetch(AI_API_BASE + "/api/schedules/image", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: base64 }),
          });
          const j = await resp.json();
          loading.remove();
          if(!j.ok){ addMsg("error", j.error || "没识别出日程", "日程"); return; }
          addMsg("saved", (j.count > 1)
            ? `📅 已记入 ${j.added} 条日程${j.skipped ? `（跳过重复 ${j.skipped} 条）` : ''}`
            : `📅 已记入日程表：${j.parsed.date}${j.parsed.time ? ' ' + j.parsed.time : ''} · ${j.parsed.content}`, "日程已存");
          if(view === "schedule") renderSchedule();
          return;
        }
        const resp = await fetch(AI_API_BASE + "/api/input/image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64, history: homeAIHistory, prompt: kind === 'ledger' ? '记账' : '' }),
        });
        const data2 = await resp.json();
        loading.remove();
        if(!data2.ok){
          addMsg("error", data2.error || "识别失败", "错误");
          return;
        }
        const text = data2.recognizedText || "(识别为空)";
        addMsg("user", text, "图片识别");
        homeAIHistory.push({ role: "user", content: text });
        if(homeAIHistory.length > 20) homeAIHistory.splice(0, homeAIHistory.length - 20);
        if(data2.mode === "chat"){
          addMsg("assistant", data2.reply || "(空)", "AI");
          homeAIHistory.push({ role: "assistant", content: data2.reply || "" });
        } else if(data2.mode === "answer"){
          addMsg("assistant", data2.reply || "(空回答)", "AI 回答");
          homeAIHistory.push({ role: "assistant", content: data2.reply || "" });
        } else if(data2.mode === "saved"){
          let body = `已保存为「${data2.type}」\n标题：${data2.title}\n目录：${data2.dir}`;
          if(data2.profileUpdated) body += `\n认知条目：+${data2.profileItems} 条`;
          addMsg("saved", body, "记录已存" + (data2.profileUpdated ? " · 认知+" + data2.profileItems : ""));
        }
        if(homeAIHistory.length > 20) homeAIHistory.splice(0, homeAIHistory.length - 20);
      } catch(err){
        loading.remove();
        addMsg("error", "无法连接 " + AI_API_BASE, "连接失败");
      } finally {
        homeChatSending = false;
        imgInput.value = "";
      }
    };
  }

  // ==== 页面内截图入口：data-upload 按钮 → 带 kind 触发文件选择 ====
  document.addEventListener('click', function(e){
    const btn = e.target.closest('[data-upload]');
    if(!btn) return;
    e.preventDefault();
    const gInput = document.getElementById('globalUploadInput');
    if(!gInput) return;
    gInput.dataset.kind = btn.dataset.upload;
    gInput.click();
  }, true);

  // 全局上传 input：选图后按 kind 自动发送
  (function(){
    const gInput = document.getElementById('globalUploadInput');
    if(!gInput) return;
    gInput.onchange = async function(e){
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const kind = gInput.dataset.kind || '';
      gInput.dataset.kind = '';
      gInput.value = '';
      try {
        const base64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result || '').split(',')[1] || '');
          r.onerror = () => rej(new Error('读文件失败'));
          r.readAsDataURL(file);
        });
        if(kind === 'calendar'){
          const resp = await fetch(AI_API_BASE + '/api/schedules/image', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64 }),
          });
          const j = await resp.json();
          if(!j.ok){ alert(j.error || '没识别出日程'); return; }
          alert((j.count > 1)
            ? ('📅 已记入 ' + j.added + ' 条日程' + (j.skipped ? '（跳过重复 ' + j.skipped + ' 条）' : ''))
            : ('📅 已记入日程表：' + j.parsed.date + (j.parsed.time ? ' ' + j.parsed.time : '') + ' · ' + j.parsed.content));
          if(view === 'schedule') renderSchedule();
        } else if(kind === 'ledger'){
          const resp = await fetch(AI_API_BASE + '/api/input/image', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64, prompt: '记账' }),
          });
          const j = await resp.json();
          if(!j.ok){ alert(j.error || '识别失败'); return; }
          if(j.mode === 'chat' && j.reply){
            view = 'home'; render();
            setTimeout(() => {
              if(window._chatAddMsg) window._chatAddMsg('assistant', j.reply, '记账候选');
            }, 150);
          } else {
            alert('识别完成：' + (j.recognizedText || '').slice(0, 120));
          }
        }
      } catch(err){ alert('处理失败：' + err.message); }
    };
  })();
}

// 首页角标：待拍板 = AI 选题建议 + 全窗口自动捕捉的任务（聊天/妙记/视频收录）
function initTaskBadge(){
  const badge = document.getElementById("homeTaskBadge");
  const countEl = document.getElementById("homeTaskCount");
  if(!badge) return;
  Promise.all([
    fetch(AI_API_BASE + '/api/tasks/suggestions').then((x) => x.json()).catch(() => null),
    fetch(AI_API_BASE + '/api/tasks/captured').then((x) => x.json()).catch(() => null),
  ]).then(([s, c]) => {
    const ns = (s && s.ok && s.items) ? s.items.length : 0;
    const nc = (c && c.ok && c.items) ? c.items.length : 0;
    const n = ns + nc;
    if(countEl) countEl.textContent = n;
    badge.style.display = n > 0 ? 'inline' : 'none';
    // AI 助手卡右侧胶囊同步同一个数（复用同一次请求，零新增请求）
    const cp = document.getElementById("chatPendingChip"); if(cp) cp.textContent = `⚡ 待拍板 ${n}`;
    const ct = document.getElementById("chatTodoChip"); if(ct){ const t=data.todo||[]; ct.textContent = `📅 今日计划 ${t.filter(x=>x.done).length}/${t.length}`; }

}

// 建议卡片列表：左侧蓝色序号，派给 AI 就地展开结果，忽略淡出重排
// endpoint 可换：'/api/tasks/suggestions'（选题建议）| '/api/tasks/captured'（自动捕捉的任务）
function mountSuggestionsD(listEl, onCount, endpoint, emptyText){
  const EP = endpoint || '/api/tasks/suggestions';
  const EMPTY = emptyText || '暂无待拍板的选题建议<br>收录新视频后，AI 会在这里给出可拍选题';
  async function refresh(){
    if(!listEl) return;
    let j;
    try { j = await fetch(AI_API_BASE + EP).then((x) => x.json()); }
    catch(e){ return; }
    const items = (j && j.ok && j.items) ? j.items : [];
    if(typeof onCount === 'function') onCount(items.length);
    listEl.innerHTML = '';
    if(!items.length){
      listEl.innerHTML = '<div style="padding:28px 8px;text-align:center;color:var(--text-tertiary,#999);font-size:13px">' + EMPTY + '</div>';
      return;
    }
    items.forEach((it, idx) => {
      const card = document.createElement('div');
      card.style.cssText = 'border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--surface-card,#fff)';
      const top = document.createElement('div');
      top.style.cssText = 'display:flex;gap:10px;align-items:flex-start';
      const no = document.createElement('span');
      no.textContent = idx + 1;
      no.style.cssText = 'flex:none;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:#2b5cb8;color:#fff;font-size:12px';
      const name = document.createElement('div');
      name.textContent = it.title.replace(/^【选题】/, '');
      name.style.cssText = 'flex:1;font-size:14px;font-weight:600;line-height:1.45';
      top.appendChild(no); top.appendChild(name);
      const bar = document.createElement('div');
      bar.style.cssText = 'display:flex;gap:9px;margin-top:9px';
      const accept = document.createElement('button');
      accept.textContent = '派给 AI';
      accept.style.cssText = 'padding:5px 15px;font-size:12.5px;border:none;border-radius:8px;background:#2b5cb8;color:#fff;cursor:pointer';
      const dismiss = document.createElement('button');
      dismiss.textContent = '忽略';
      dismiss.style.cssText = 'padding:5px 15px;font-size:12.5px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text-tertiary);cursor:pointer';
      const out = document.createElement('div');
      out.style.cssText = 'display:none;margin-top:9px;padding:10px 12px;border-radius:8px;background:var(--page-bg,#f6f7f9);font-size:13px;color:var(--text,#333);white-space:pre-wrap;line-height:1.7';
      const copyBtn = document.createElement('button');
      copyBtn.textContent = '📋 复制';
      copyBtn.style.cssText = 'display:none;margin-top:7px;padding:3px 11px;font-size:11.5px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-tertiary);cursor:pointer';
      copyBtn.onclick = () => {
        const ta = document.createElement('textarea');
        ta.value = out.textContent; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        copyBtn.textContent = '已复制'; setTimeout(()=>{ copyBtn.textContent = '📋 复制'; }, 1200);
      };
      accept.onclick = async () => {
        accept.disabled = true; accept.textContent = 'AI 执行中…';
        try {
          const r = await fetch(AI_API_BASE + '/api/tasks/accept', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ recordId: it.recordId }),
          }).then((x) => x.json());
          if(r.ok && r.reply){
            out.textContent = r.reply;
            out.style.display = 'block'; copyBtn.style.display = 'inline-block';
            accept.textContent = '✓ 已完成'; accept.disabled = true;
            dismiss.style.display = 'none';
          } else {
            accept.textContent = '失败，重试'; accept.disabled = false;
            out.textContent = r.error || '执行失败'; out.style.display = 'block';
          }
        } catch(e){ accept.textContent = '失败，重试'; accept.disabled = false; }
      };
      dismiss.onclick = async () => {
        try {
          await fetch(AI_API_BASE + '/api/tasks/dismiss', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ recordId: it.recordId }),
          });
        } catch(e){}
        card.style.opacity = '.4';
        setTimeout(() => { card.remove(); refresh(); }, 200);
      };
      bar.appendChild(accept); bar.appendChild(dismiss);
      card.appendChild(top); card.appendChild(bar); card.appendChild(out); card.appendChild(copyBtn);
      listEl.appendChild(card);
    });
  }
  refresh();
  return { refresh };
}

  document.getElementById("wClusterRow").querySelectorAll("[data-cluster]").forEach((el) => {
    el.onclick = () => { s.cluster = el.dataset.cluster; paintWChips("wClusterRow", "cluster", s.cluster); previewWMaterials(); };
  });
  kw.onchange = () => { s.keyword = kw.value.trim(); previewWMaterials(); };
  document.getElementById("wGenBtn").onclick = wGenerate;
  attachDictationMicD(document.getElementById("wMicBtn"), document.getElementById("wBrief"), document.getElementById("wMicMsg"));
  previewWMaterials();

}

/* ---------- 我的评价独立页：全部视频 · 按话题簇筛选 · 随时补评 ---------- */
const D_REVIEW_CLUSTERS = ["AI与第二大脑","认知与决策","搞钱与周期","家庭与教育","高校生存","个人成长"];
let dRvItems = [], dRvCluster = "", dRvOnlyUnrated = false;
let dRvTab = "videos";      // 当前 tab："videos" 视频评价 | "exp" 经验复盘
let dRvScores = {};         // url -> 已提交星级（1-5，0/undefined = 未评），页面会话内记忆
let dExpItems = [];         // 经验卡片缓存
let dExpType = "";          // 经验类型筛选："" = 全部 / ✅加分行为 / ❌减分行为 / 🟡中性观察

    // 用后端返回的 rating 初始化星级缓存，刷新页面后已评的星星显示实心
    dRvItems.forEach(it => { if(it.rating > 0) dRvScores[it.url] = it.rating; });
  }catch(e){ bar.textContent = "加载失败：" + e.message; return; }
  paintDReviews();
}

function paintDReviews(){
  const bar = document.getElementById("rvFilterBar");
  const list = document.getElementById("rvList");
  if(!bar || !list) return;
  const total = dRvItems.length, rated = dRvItems.filter(x => x.hasComment).length;
  const counts = {};
  dRvItems.forEach(x => { if(x.cluster) counts[x.cluster] = (counts[x.cluster]||0)+1; });
  const chip = (key, label, n) => {
    const active = dRvCluster === key;
    return `<span data-rvc="${esc(key)}" style="display:inline-block;padding:4px 12px;margin:3px 6px 3px 0;border-radius:14px;font-size:12.5px;cursor:pointer;${active ? "background:#2b5cb8;color:#fff" : "background:var(--surface-card);color:var(--text);border:1px solid var(--border)"}">${esc(label)}${n != null ? " " + n : ""}</span>`;
  };
  let h = `<div style="margin-bottom:6px">已评 <b style="color:#2b5cb8">${rated}</b> / ${total} 条</div><div style="line-height:2.1">`;
  h += chip("", "全部", total);
  D_REVIEW_CLUSTERS.forEach(c => { if(counts[c]) h += chip(c, c, counts[c]); });
  h += `</div><label style="display:flex;align-items:center;gap:6px;margin-top:5px;cursor:pointer">
    <input type="checkbox" id="rvOnlyUnrated" ${dRvOnlyUnrated ? "checked" : ""}/> 只看未评价（${total - rated} 条）</label>`;
  bar.innerHTML = h;
  bar.querySelectorAll("[data-rvc]").forEach(el => el.onclick = () => { dRvCluster = el.getAttribute("data-rvc") || ""; paintDReviews(); });
  const cb = document.getElementById("rvOnlyUnrated");
  if(cb) cb.onchange = () => { dRvOnlyUnrated = cb.checked; paintDReviews(); };

  let items = dRvItems.filter(x => (!dRvCluster || x.cluster === dRvCluster) && (!dRvOnlyUnrated || !x.hasComment));
  items = items.slice().sort((a,b) => a.hasComment === b.hasComment ? 0 : a.hasComment ? 1 : -1);
  // 星级排序：有评分的在前按分数降序，未评分的在后保持原序（稳定排序）
  items = items.slice().sort((a,b) => (dRvScores[b.url] || 0) - (dRvScores[a.url] || 0));
  if(!items.length){
    list.innerHTML = `<div style="text-align:center;color:var(--text-tertiary);font-size:13.5px;padding:48px 20px">${total ? "这个筛选下没有未评价的视频 👍" : "还没有收录任何视频"}</div>`;
    return;
  }
  list.innerHTML = items.map(it => {
    const tags = [
      it.cluster ? `<span style="font-size:10.5px;color:#2b5cb8;background:#eef4ff;border-radius:4px;padding:1px 7px">${esc(it.cluster)}</span>` : "",
      it.level ? `<span style="font-size:10.5px;color:var(--text-tertiary);background:var(--surface-card);border:1px solid var(--border);border-radius:4px;padding:1px 7px">${esc(it.level)}</span>` : "",
    ].join(" ");
    const link = it.url ? ` <a href="${esc(it.url)}" target="_blank" style="color:var(--text-tertiary);font-size:11.5px;text-decoration:none">原视频↗</a>` : "";
    const starline = it.url
      ? `<div style="margin-top:9px;display:flex;align-items:center;gap:2px;flex-wrap:wrap"><span style="font-size:12px;color:var(--text-tertiary);margin-right:4px">值得模仿</span>${dStarRowHtml(it.url, dRvScores[it.url] || 0)}</div>`
      : "";
    const body = it.hasComment
      ? `<div style="margin-top:9px;padding:9px 11px;background:var(--page-bg);border-radius:8px;font-size:13px;line-height:1.7;white-space:pre-wrap">${esc(it.comment)}</div>
         <div style="margin-top:8px;display:flex;align-items:center;gap:9px;flex-wrap:wrap">
           <button data-rvadd="${esc(it.recordId)}" style="padding:3px 11px;font-size:12px;border:1px solid var(--border);border-radius:7px;background:transparent;color:#2b5cb8;cursor:pointer">➕ 再补一条</button>
           <button data-rvtoexp="${esc(it.recordId)}" style="padding:3px 11px;font-size:12px;border:1px solid var(--border);border-radius:7px;background:transparent;color:#2b5cb8;cursor:pointer">→ 经验</button>
           <span class="rv-exp-msg" style="font-size:11.5px;color:#1f7a3d"></span>
         </div>`
      : `<div style="margin-top:9px;font-size:12.5px;color:#c47f17">✍️ 还没评价</div>
         <button data-rvadd="${esc(it.recordId)}" style="margin-top:7px;padding:4px 13px;font-size:12.5px;border:1px solid #c7dbff;border-radius:7px;background:#eef4ff;color:#2b5cb8;cursor:pointer">✍️ 写评价</button>`;
    return `<div class="panel" data-rvcard="${esc(it.recordId)}" style="padding:14px 16px">
      <div style="font-size:14px;font-weight:600;line-height:1.5">${esc(it.title)}${link}</div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${tags}</div>${starline}${body}</div>`;
  }).join("");
  list.querySelectorAll("[data-rvadd]").forEach(btn => btn.onclick = () => openDRvEditor(btn.getAttribute("data-rvadd")));
  // 星级评分 / 评价转经验：事件委托（星星更新会替换行内 HTML，委托避免重复绑定）
  list.onclick = (e) => {
    const star = e.target.closest("[data-rvstar]");
    if(star){ dRateVideo(star.getAttribute("data-rvstar"), +star.getAttribute("data-n")); return; }
    const toexp = e.target.closest("[data-rvtoexp]");
    if(toexp) sendDReviewToExp(toexp.getAttribute("data-rvtoexp"));
  };
}

// 评价框语音输入：点「🎙 语音」开始录、再点结束 → /api/asr/transcribe → 追加到文本框
function attachDictationMicD(btn, textarea, msgEl){
  let mediaStream=null, recorder=null, chunks=[], recording=false;
  const setIdle = () => { btn.disabled=false; btn.textContent="🎙 语音"; btn.style.background=""; btn.style.color="#2b5cb8"; btn.style.borderColor="#c7dbff"; };
  btn.onclick = async () => {
    if(recording){
      recording=false; setIdle();
      try{ recorder.stop(); }catch(e){}
      if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
      return;
    }
    if(!navigator.mediaDevices || !window.MediaRecorder){
      if(msgEl){ msgEl.style.color="#c47f17"; msgEl.textContent="当前页面不是安全上下文，麦克风不可用：Mac 请用 http://localhost:3000 访问。"; }
      return;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      if(msgEl){ msgEl.style.color="#c0392b"; msgEl.textContent="麦克风权限被拒绝，请在浏览器设置里允许"; }
      return;
    }
    chunks=[];
    const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
    recorder = new MediaRecorder(mediaStream, mime?{mimeType:mime}:undefined);
    recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, {type: mime || "audio/webm"});
      if(blob.size < 2000){ if(msgEl){ msgEl.style.color="#c0392b"; msgEl.textContent="录音太短，没收到声音"; } return; }
      btn.disabled=true; btn.textContent="识别中…"; btn.style.background=""; btn.style.color="#2b5cb8";
      if(msgEl){ msgEl.style.color="#2b5cb8"; msgEl.textContent="语音识别中…"; }
      try{
        const d = await fetch(AI_API_BASE + "/api/asr/transcribe", { method:"POST", headers:{"Content-Type": blob.type||"audio/webm"}, body: blob }).then(x=>x.json());
        if(!d.ok) throw new Error(d.error||"转写失败");
        const cur = textarea.value.trim();
        textarea.value = cur ? cur + " " + d.text : d.text;
        textarea.focus();
        if(msgEl){ msgEl.style.color="#2b5cb8"; msgEl.textContent="✅ 已转文字，可编辑或再点🎙说一段"; }
      }catch(e){
        if(msgEl){ msgEl.style.color="#c0392b"; msgEl.textContent=e.message; }
      }finally{ setIdle(); }
    };
    recorder.start();
    recording=true;
    btn.textContent="⏹ 结束"; btn.style.background="#e5484d"; btn.style.color="#fff"; btn.style.borderColor="#e5484d"; btn.disabled=false;
    if(msgEl){ msgEl.style.color="#c0392b"; msgEl.textContent="● 正在录音，再点一下结束"; }
  };
}

function openDRvEditor(recordId){
  const card = document.querySelector(`[data-rvcard="${CSS.escape(recordId)}"]`);
  if(!card) return;
  const oldBtn = card.querySelector("[data-rvadd]");
  if(oldBtn) oldBtn.style.display = "none";
  const wrap = document.createElement("div");
  wrap.style.cssText = "margin-top:9px";
  wrap.innerHTML = `
    <textarea rows="3" placeholder="写下你的看法…（直接存飞书表，AI 不改写）" style="width:100%;padding:9px;border:1px solid #c7dbff;border-radius:9px;font-size:13px;font-family:inherit;resize:vertical;box-sizing:border-box"></textarea>
    <div style="margin-top:7px;display:flex;gap:9px;flex-wrap:wrap;align-items:center">
      <button class="rv-save" style="padding:5px 15px;font-size:13px;border:none;border-radius:7px;background:#2b5cb8;color:#fff;cursor:pointer">保存评价</button>
      <button class="rv-mic" style="padding:5px 13px;font-size:13px;border:1px solid #c7dbff;border-radius:7px;background:transparent;color:#2b5cb8;cursor:pointer">🎙 语音</button>
      <button class="rv-cancel" style="padding:5px 15px;font-size:13px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text-tertiary);cursor:pointer">取消</button>
      <span class="rv-msg" style="font-size:12px;color:#c0392b;align-self:center"></span>
    </div>`;
  card.appendChild(wrap);
  const ta = wrap.querySelector("textarea"), msg = wrap.querySelector(".rv-msg"), saveBtn = wrap.querySelector(".rv-save");
  attachDictationMicD(wrap.querySelector(".rv-mic"), ta, msg);
  ta.focus();
  wrap.querySelector(".rv-cancel").onclick = () => { wrap.remove(); if(oldBtn) oldBtn.style.display = ""; };
  saveBtn.onclick = async () => {
    const text = ta.value.trim();
    if(!text){ msg.style.color="#c0392b"; msg.textContent = "内容为空"; return; }
    saveBtn.disabled = true; saveBtn.textContent = "保存中…";
    try{
      const d = await fetch(AI_API_BASE + "/api/videos/comment", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ recordId, text }),
      }).then(x => x.json());
      if(!d.ok) throw new Error(d.error || "保存失败");
      const it = dRvItems.find(x => x.recordId === recordId);
      if(it){
        const dt = new Date(Date.now() + 8*3600*1000), p = n => String(n).padStart(2,"0");
        const block = `【${p(dt.getUTCMonth()+1)}-${p(dt.getUTCDate())} ${p(dt.getUTCHours())}:${p(dt.getUTCMinutes())}】${text}`;
        it.comment = it.comment ? `${it.comment}\n\n${block}` : block;
        it.hasComment = true;
      }
      paintDReviews();
    }catch(e){ msg.style.color="#c0392b"; msg.textContent = e.message; saveBtn.disabled = false; saveBtn.textContent = "保存评价"; }
  };
}

/* ---------- 评价页 Tab 切换 + 星级评分 + 评价转经验 + 经验复盘 ---------- */
function switchDRvTab(tab){
  dRvTab = tab;
  const tv = document.getElementById("rvTabVideos"), te = document.getElementById("rvTabExp");
  if(!tv || !te) return;
  tv.style.display = tab === "exp" ? "none" : "";
  te.style.display = tab === "exp" ? "" : "none";
  document.querySelectorAll("[data-rvtab]").forEach(el => {
    const active = (el.getAttribute("data-rvtab") || "videos") === tab;
    el.style.background = active ? "#2b5cb8" : "var(--surface-card)";
    el.style.color = active ? "#fff" : "var(--text)";
    el.style.border = "1px solid " + (active ? "#2b5cb8" : "var(--border)");
  });
  if(tab === "exp") loadDExperiences();
}

function dStarRowHtml(url, score){
  let stars = "";
  for(let n = 1; n <= 5; n++){
    const on = n <= score;
    stars += `<span data-rvstar="${esc(url)}" data-n="${n}" style="cursor:pointer;font-size:17px;line-height:1;padding:0 1px;color:${on ? "#f5a623" : "#c9c9c4"}">${on ? "★" : "☆"}</span>`;
  }
  return `<span data-rvstars="${esc(url)}" style="display:inline-flex;align-items:center;flex-wrap:wrap">${stars}<span class="rv-score-msg" style="font-size:11.5px;color:#1f7a3d;margin-left:6px">${score ? "已评 " + score + " 星" : ""}</span></span>`;
}

function paintDStarsFor(url){
  const html = dStarRowHtml(url, dRvScores[url] || 0);
  document.querySelectorAll("[data-rvstars]").forEach(el => {
    if(el.getAttribute("data-rvstars") === url) el.outerHTML = html;
  });
}

// 点第 N 颗星提交；再点当前分数的同一颗星 = 清除
async function dRateVideo(url, n){
  const next = (dRvScores[url] || 0) === n ? 0 : n;
  try{
    const d = await fetch(AI_API_BASE + "/api/videos/rate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, score: next }),
    }).then(x => x.json());
    if(!d.ok) throw new Error(d.error || "评分失败");
    dRvScores[url] = next;
    paintDStarsFor(url);
    if(!next){
      document.querySelectorAll("[data-rvstars]").forEach(el => {
        if(el.getAttribute("data-rvstars") !== url) return;
        const m = el.querySelector(".rv-score-msg");
        if(m) m.textContent = "已清除";
      });
    }
  }catch(e){
    document.querySelectorAll("[data-rvstars]").forEach(el => {
      if(el.getAttribute("data-rvstars") !== url) return;
      const m = el.querySelector(".rv-score-msg");
      if(m){ m.style.color = "#c0392b"; m.textContent = e.message; }
    });
  }
}

async function sendDReviewToExp(recordId){
  const it = dRvItems.find(x => x.recordId === recordId);
  if(!it || !it.comment) return;
  let btn = null, msg = null;
  document.querySelectorAll("[data-rvcard]").forEach(card => {
    if(card.getAttribute("data-rvcard") !== recordId) return;
    btn = card.querySelector("[data-rvtoexp]");
    msg = card.querySelector(".rv-exp-msg");
  });
  if(!btn) return;
  btn.disabled = true; btn.textContent = "入库中…";
  try{
    const d = await fetch(AI_API_BASE + "/api/experience/from-review", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: it.comment, videoTitle: it.title || "", cluster: it.cluster || "" }),
    }).then(x => x.json());
    if(!d.ok) throw new Error(d.error || "入库失败");
    btn.textContent = "✓ 已入库";
    if(msg) msg.textContent = "已存入经验复盘，AI 已归类";
  }catch(e){
    btn.disabled = false; btn.textContent = "→ 经验";
    if(msg){ msg.style.color = "#c0392b"; msg.textContent = e.message; }
  }
}

async function loadDExperiences(){
  const bar = document.getElementById("expFilterBar");
  const list = document.getElementById("expList");
  if(!bar || !list) return;
  try{
    const d = await fetch(AI_API_BASE + "/api/experience/list").then(x => x.json());
    if(!d.ok) throw new Error(d.error || "加载失败");
    dExpItems = d.items || [];
  }catch(e){
    bar.textContent = "加载失败：" + e.message;
    return;
  }
  paintDExperiences();
}

function dExpCardHtml(it){
  const tone = it.type === "✅加分行为" ? { c:"#1f7a3d", bg:"#eaf7ee", bd:"#bfe3c8" }
    : it.type === "❌减分行为" ? { c:"#c0392b", bg:"#fdeeed", bd:"#f3c6c1" }
    : { c:"#8a6d1a", bg:"#faf6e8", bd:"#e6d9a8" };
  const tag = (t, color, bg, bd) => `<span style="font-size:10.5px;color:${color};background:${bg};border:1px solid ${bd};border-radius:4px;padding:1px 7px">${esc(t)}</span>`;
  const level = it.level === "🔥核心原则"
    ? `<span style="font-size:10.5px;color:#c0392b;background:#fdeeed;border:1px solid #f3c6c1;border-radius:4px;padding:1px 7px;font-weight:600">🔥核心原则</span>`
    : (it.level ? `<span style="font-size:10.5px;color:var(--text-tertiary);background:var(--surface-card);border:1px solid var(--border);border-radius:4px;padding:1px 7px">${esc(it.level)}</span>` : "");
  const vt = it.videoTitle ? (it.videoTitle.length > 24 ? it.videoTitle.slice(0, 24) + "…" : it.videoTitle) : "";
  const metas = [
    it.category ? tag(it.category, "#2b5cb8", "#eef4ff", "#c7dbff") : "",
    it.cluster ? tag(it.cluster, "#2b5cb8", "#eef4ff", "#c7dbff") : "",
    vt ? tag("🎬 " + vt, "var(--text-tertiary)", "var(--surface-card)", "var(--border)") : "",
    it.source ? tag("来源 " + it.source, "var(--text-tertiary)", "var(--surface-card)", "var(--border)") : "",
  ].filter(Boolean).join(" ");
  return `<div class="panel" style="padding:14px 16px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span style="font-size:10.5px;color:${tone.c};background:${tone.bg};border:1px solid ${tone.bd};border-radius:4px;padding:1px 7px">${esc(it.type || "🟡中性观察")}</span>
      ${level}
    </div>
    <div style="margin-top:8px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;color:var(--text)">${esc(it.content)}</div>
    ${metas ? `<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${metas}</div>` : ""}
  </div>`;
}

function paintDExperiences(){
  const bar = document.getElementById("expFilterBar");
  const list = document.getElementById("expList");
  if(!bar || !list) return;
  const chip = (key, label, n) => {
    const active = dExpType === key;
    return `<span data-exptype="${esc(key)}" style="display:inline-block;padding:4px 12px;margin:3px 6px 3px 0;border-radius:14px;font-size:12.5px;cursor:pointer;${active ? "background:#2b5cb8;color:#fff" : "background:var(--surface-card);color:var(--text);border:1px solid var(--border)"}">${esc(label)} ${n}</span>`;
  };
  const cnt = t => dExpItems.filter(x => x.type === t).length;
  bar.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <div style="line-height:2.1">${chip("", "全部", dExpItems.length)}${chip("✅加分行为", "✅加分", cnt("✅加分行为"))}${chip("❌减分行为", "❌减分", cnt("❌减分行为"))}${chip("🟡中性观察", "🟡中性", cnt("🟡中性观察"))}</div>
    <button id="expAddBtn" style="padding:6px 15px;font-size:12.5px;border:1px solid #c7dbff;border-radius:8px;background:#eef4ff;color:#2b5cb8;cursor:pointer;white-space:nowrap">✍️ 记经验</button>
  </div>`;
  bar.querySelectorAll("[data-exptype]").forEach(el => {
    el.onclick = () => { dExpType = el.getAttribute("data-exptype") || ""; paintDExperiences(); };
  });
  document.getElementById("expAddBtn").onclick = openDExpForm;

  const items = dExpType ? dExpItems.filter(x => x.type === dExpType) : dExpItems;
  if(!items.length){
    list.innerHTML = `<div class="panel" style="text-align:center;color:var(--text-tertiary);font-size:13.5px;padding:48px 20px;line-height:1.9">${dExpItems.length ? "这个筛选下还没有经验" : "还没有经验卡片<br>写评价点「→ 经验」，或点「✍️ 记经验」开始积累"}</div>`;
    return;
  }
  list.innerHTML = items.map(dExpCardHtml).join("");
}

function openDExpForm(){
  const wrap = document.getElementById("expFormWrap");
  if(!wrap) return;
  if(wrap.innerHTML){ wrap.innerHTML = ""; return; } // 已展开再点收起
  wrap.innerHTML = `
    <div class="panel" style="padding:14px 16px;margin-bottom:14px">
      <textarea id="expContent" rows="3" placeholder="记下这条经验…（发生了什么 / 学到什么 / 下次怎么做）" style="width:100%;padding:9px;border:1px solid #c7dbff;border-radius:9px;font-size:13.5px;font-family:inherit;resize:vertical;box-sizing:border-box"></textarea>
      <div style="margin-top:9px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px">
        <span style="display:inline-flex;align-items:center;gap:6px;color:var(--text-tertiary)">类型
          <label style="cursor:pointer"><input type="radio" name="expTypeOpt" value="✅加分行为" checked/> ✅</label>
          <label style="cursor:pointer"><input type="radio" name="expTypeOpt" value="❌减分行为"/> ❌</label>
          <label style="cursor:pointer"><input type="radio" name="expTypeOpt" value="🟡中性观察"/> 🟡</label>
        </span>
        <span style="display:inline-flex;align-items:center;gap:6px;color:var(--text-tertiary)">级别
          <label style="cursor:pointer"><input type="radio" name="expLevelOpt" value="普通经验" checked/> 普通</label>
          <label style="cursor:pointer"><input type="radio" name="expLevelOpt" value="🔥核心原则"/> 🔥核心</label>
        </span>
      </div>
      <div style="margin-top:10px;display:flex;gap:9px;align-items:center">
        <button id="expSaveBtn" style="padding:6px 16px;font-size:13px;border:none;border-radius:7px;background:#2b5cb8;color:#fff;cursor:pointer">保存</button>
        <button id="expCancelBtn" style="padding:6px 16px;font-size:13px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text-tertiary);cursor:pointer">取消</button>
        <span id="expFormMsg" style="font-size:12px;color:#c0392b"></span>
      </div>
    </div>`;
  document.getElementById("expContent").focus();
  document.getElementById("expCancelBtn").onclick = () => { wrap.innerHTML = ""; };
  document.getElementById("expSaveBtn").onclick = saveDExpForm;
