async function saveDExpForm(){
  const ta = document.getElementById("expContent");
  const msg = document.getElementById("expFormMsg");
  const btn = document.getElementById("expSaveBtn");
  if(!ta || !msg || !btn) return;
  const text = ta.value.trim();
  if(!text){ msg.textContent = "内容为空"; return; }
  const type = (document.querySelector('input[name="expTypeOpt"]:checked') || {}).value || "🟡中性观察";
  const level = (document.querySelector('input[name="expLevelOpt"]:checked') || {}).value || "普通经验";
  btn.disabled = true; btn.textContent = "保存中…";
  try{
    const d = await fetch(AI_API_BASE + "/api/experience/add", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text, type, level, source: "手动记录" }),
    }).then(x => x.json());
    if(!d.ok) throw new Error(d.error || "保存失败");
    const wrap = document.getElementById("expFormWrap");
    if(wrap) wrap.innerHTML = "";
    await loadDExperiences();
  }catch(e){
    msg.textContent = e.message;
    btn.disabled = false; btn.textContent = "保存";
  }
}

/* ---------- INSIGHT ---------- */
function renderInsight(){
  const cards=CONFIG.modules.map(m=>{ const it=data[m.key]||[]; let main="", pct=0;
    if(m.type==="todo"){ main=`${it.filter(x=>x.done).length}/${it.length} 已完成`; pct=it.length?Math.round(it.filter(x=>x.done).length/it.length*100):0; }
    else if(m.type==="checkin"){ const t=today(); main=`今日 ${it.filter(x=>x.log&&x.log[t]).length}/${it.length} 打卡`; pct=it.length?Math.round(it.filter(x=>x.log&&x.log[t]).length/it.length*100):0; }
    else if(m.type==="progress"){ pct=avgProgress(it).value; main=`平均进度 ${pct}%`; }
    else if(m.type==="finance"){ const e=it.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0); const inc=it.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0); main=`收 ¥${inc} · 支 ¥${e}`; }
    else main=`${it.length} 条记录`;
    return `<div class="pin" data-open="${m.key}" style="cursor:pointer">
      <span class="pin-ic" style="color:${m.color};background:${m.tint};border-color:transparent">${icon(m.icon,19)}</span>
      <div class="pin-b"><div class="pin-t">${m.name}</div><div class="pin-m">${main}</div>
      ${['progress','todo','checkin'].includes(m.type)?`<div class="hero-bar" style="margin-top:9px"><i style="width:${pct}%;background:${m.color}"></i></div>`:''}</div>
      <span class="arw" style="color:var(--text-tertiary)">${icon("chevron",16,2)}</span></div>`; }).join("");
  $("#screen").innerHTML=`<div class="header"><div><h2>洞察</h2><p>各模块进展一览 · 记录—执行—统计—反馈</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="sec-title">模块概况</div><div class="pin-list" style="grid-template-columns:repeat(3,1fr)">${cards}</div>`;
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
}

/* ---------- MODULE VIEW ---------- */
function renderModule(key){
  const m=modOf(key); const all=data[key]||[]; let it=all;
  const t=today();
  const q=searchQ.trim().toLowerCase();
  if(q) it=all.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.note||x.content||"").toLowerCase().includes(q));

  let head="";
  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">收入</div><div class="v" style="color:var(--module-1)">¥${inc}</div></div>
      <div class="mini"><div class="l">支出</div><div class="v" style="color:var(--danger)">¥${exp}</div></div>
      <div class="mini"><div class="l">结余</div><div class="v">¥${inc-exp}</div></div>
      <div class="mini"><div class="l">笔数</div><div class="v">${all.length}</div></div></div>`;
  } else if(m.type==="todo"){
    const done=all.filter(x=>x.done).length;
    head=headHero(m, `${done}/${all.length}`, "今日已完成");
  } else if(m.type==="checkin"){
    const done=all.filter(x=>x.log&&x.log[t]).length;
    head=headHero(m, `${done}/${all.length}`, "今日已打卡");
  } else if(m.type==="progress"){
    const p=avgProgress(all);
    head=headHero(m, `${p.value}%`, `平均进度 · ${all.length} 项`);
  } else if(m.type==="note"){
    const todayN=all.filter(x=>x.date===t).length;
    head=headHero(m, `${all.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }

  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,28)}</span><div>${q?'没有匹配的记录':'还没有记录，点右上角「新建」添加第一条吧'}</div></div>`;

  $("#screen").innerHTML=`<div class="header"><div><h2>${m.name}</h2><p>${m.desc}</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="toolbar">
      <div class="search-box">${icon("search",15,2.2)}<input id="search" placeholder="搜索…" value="${attr(searchQ)}"/></div>
      <div class="spacer"></div><button class="btn" id="btn-new">${icon("plus",16,2.2)}新建</button></div>
    ${head}
    <div class="mod-layout">
      <div class="mod-main">
        <div class="sec-title">全部记录 <span id="rec-count" style="margin-left:auto;font-weight:500;color:var(--text-secondary);font-size:12px">${it.length} 条</span></div>
        <div class="rec-grid">${body}</div>
      </div>
      <aside class="mod-side">${sideStats(m,all)}</aside>
    </div>`;
  const s=$("#search");
  let composing=false;
  const refresh=()=>{ searchQ=s.value; renderModuleResults(key); };
  s.addEventListener("compositionstart",()=>{ composing=true; });
  s.addEventListener("compositionend",()=>{ composing=false; refresh(); });
  s.addEventListener("input",()=>{ if(!composing) refresh(); });
  $("#btn-new").onclick=()=>openEditor(key,null);
  wireModule(key);
}

/* 仅刷新受搜索影响的记录列表与计数，不重建搜索框（避免打断中文输入法） */
function renderModuleResults(key){
  const m=modOf(key); const all=data[key]||[];
  const q=searchQ.trim().toLowerCase();
  const it=q?all.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.note||x.content||"").toLowerCase().includes(q)):all;
  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,28)}</span><div>${q?'没有匹配的记录':'还没有记录，点右上角「新建」添加第一条吧'}</div></div>`;
  const grid=$(".rec-grid"); if(grid) grid.innerHTML=body;
  const cnt=$("#rec-count"); if(cnt) cnt.textContent=`${it.length} 条`;
  wireModule(key);
}

/* 模块统计侧栏：按 type 生成多维数据，填满右侧空间 */
function sideStats(m, all){
  const t=today();
  const palette=["var(--accent)","var(--module-1)","var(--module-2)","var(--module-3)","var(--module-4)","var(--module-5)","var(--danger)"];
  const row=(k,v,dot)=>`<div class="stat-row"><span class="k">${dot?`<span class="kd" style="background:${dot}"></span>`:''}${k}</span><span class="val">${v}</span></div>`;

  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    // 支出按分类聚合
    const byCat={}; all.filter(x=>x.type==="expense").forEach(x=>{ const c=x.category||"其他"; byCat[c]=(byCat[c]||0)+ +x.amount; });
    const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const maxC=cats.length?cats[0][1]:1;
    const catBars=cats.length? cats.map((c,i)=>`<div class="cbrow"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxC*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">¥${c[1]}</span></div>`).join("")
      : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无支出记录</div>`;
    const todayExp=all.filter(x=>x.type==="expense"&&x.date===t).reduce((a,x)=>a+ +x.amount,0);
    return `<div class="side-card"><div class="sh">${icon("wallet",15)} 收支概况</div>
        ${row("总收入",`<span style="color:var(--module-1)">¥${inc}</span>`)}
        ${row("总支出",`<span style="color:var(--danger)">¥${exp}</span>`)}
        ${row("净结余",`¥${inc-exp}`)}
        ${row("今日支出",`¥${todayExp}`)}
        ${row("总笔数",`${all.length} 笔`)}</div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 支出分类占比</div><div class="catbar">${catBars}</div></div>`;
  }

  if(m.type==="progress"){
    const p=avgProgress(all);
    const doneN=all.filter(x=>((x.current/x.target)*100||0)>=100).length;
    const totalCur=all.reduce((a,x)=>a+ (+x.current||0),0);
    const totalTgt=all.reduce((a,x)=>a+ (+x.target||0),0);
    return `<div class="side-card"><div class="sh">${icon("target",15)} 总体进度</div>
        <div class="side-ring"><div class="dial">${ringSVG(p.value,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${p.value}%</span><span class="cap">平均进度</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("list",15)} 数据统计</div>
        ${row("进行项目",`${all.length} 项`)}
        ${row("已达成",`${doneN} 项`)}
        ${row("累计完成",`${totalCur} ${all[0]?.unit||m.unit||''}`)}
        ${row("总目标量",`${totalTgt} ${all[0]?.unit||m.unit||''}`)}</div>`;
  }

  if(m.type==="checkin"){
    const done=all.filter(x=>x.log&&x.log[t]).length; const pct=all.length?Math.round(done/all.length*100):0;
    const streaks=all.map(x=>({title:x.title,s:streak(x.log)})).sort((a,b)=>b.s-a.s);
    const best=streaks[0]?streaks[0].s:0;
    const list=streaks.slice(0,6).map(x=>`<div class="stat-row"><span class="k">${esc(x.title)}</span><span class="val" style="color:var(--module-3)">${x.s} 天</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("leaf",15)} 今日打卡</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${done}/${all.length}</span><span class="cap">已完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("flame",15)} 连续天数</div>
        ${row("最长连续",`<span style="color:var(--module-3)">${best} 天</span>`)}
        ${row("习惯总数",`${all.length} 个`)}
        <div style="margin-top:6px">${list}</div></div>`;
  }

  if(m.type==="todo"){
    const done=all.filter(x=>x.done).length; const pct=all.length?Math.round(done/all.length*100):0;
    const byP={}; (m.priorities||[]).forEach(p=>byP[p.key]=0); all.forEach(x=>{ if(byP[x.priority]!=null) byP[x.priority]++; });
    const pRows=(m.priorities||[]).map(p=>`<div class="stat-row"><span class="k"><span class="kd" style="background:${p.text}"></span>${p.label}</span><span class="val">${byP[p.key]||0} 项</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("list",15)} 完成情况</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${pct}%</span><span class="cap">${done}/${all.length} 完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 优先级分布</div>
        ${pRows}
        ${row("剩余待办",`${all.length-done} 项`)}</div>`;
  }

  // note
  const todayN=all.filter(x=>x.date===t).length;
  const byMood={}; all.forEach(x=>{ const md=x.mood||"未分类"; byMood[md]=(byMood[md]||0)+1; });
  const moods=Object.entries(byMood).sort((a,b)=>b[1]-a[1]);
  const maxM=moods.length?moods[0][1]:1;
  const moodBars=moods.length? moods.map((c,i)=>`<div class="cbrow"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxM*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">${c[1]} 条</span></div>`).join("")
    : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无记录</div>`;
  return `<div class="side-card"><div class="sh">${icon("pen",15)} 记录统计</div>
      ${row("累计记录",`${all.length} 条`)}
      ${row("今日新增",`${todayN} 条`)}
      ${row("标签种类",`${moods.length} 种`)}</div>
    <div class="side-card"><div class="sh">${icon("chart",15)} 标签分布</div><div class="catbar">${moodBars}</div></div>`;
}

/* per-module hero header: icon + big number + label */
function headHero(m, big, label){
  const inner=`<div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,24)}</div>
    <div class="hero-tx"><div class="hero-row"><span class="hero-v">${big}</span><span class="hero-l">${label}</span></div></div>`;
  if(m.cover) return `<div class="hero has-cover"><div class="hero-bg" style="background-image:url('${attr(m.cover)}')"></div><div class="hero-inner">${inner}</div></div>`;
  return `<div class="hero">${inner}</div>`;
}

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",15)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",13,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  const layoutCls=`rec-layout-${layout}`;

  // feature layout: 大图在上 + 标题 + 正文在下 (适合有图记录)
  if(layout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}">
      ${thumb}
      <div class="feat-title">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 16px 14px">${customBlock}</div>`:''}</div></div>`;
  }
  // quote layout: 大字居中 (适合短文本/灵感/金句)
  if(layout==='quote'){
    const text=(x.content||x.title||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      <div class="quote-text">${esc(text)}</div>
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`;
  }

  // default layout
  if(m.type==="todo"){ const p=(m.priorities||[]).find(p=>p.key===x.priority);
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px"><div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}">${sourceTag(x)}<span class="rname ${x.done?'done':''}">${esc(x.title)}</span>
      ${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}
      ${x.due?`<span style="color:#b45309;font-size:12px">⏱ ${esc(x.due)}</span>`:''}${x.owner?`<span style="color:var(--text-tertiary);font-size:12px">👤 ${esc(x.owner)}</span>`:''}
      ${x.note?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.note).slice(0,40)}</span>`:''}${customBlock}</div></div></div>`; }
  if(m.type==="checkin"){ const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px"><div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><span class="rname">${esc(x.title)}</span>
      <span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}${customBlock}</div></div></div>`; }
  if(m.type==="progress"){ const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      <span class="rdate" style="margin-left:0;color:var(--text-secondary)">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`; }
  if(m.type==="finance"){ const inc=x.type==="income";
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>
      <span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span>
      <span class="rdate">${x.date||''}</span>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}">${inc?'+':'-'}¥${x.amount}</div></div></div>`; }
  // note
  return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
    <span class="rname">${esc(x.title||'无标题')}</span>
    ${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}
    ${x.content?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.content).slice(0,40)}</span>`:''}
    <span class="rdate">${x.date||''}</span>${customBlock}</div></div></div>`;
}

function streak(log){ if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const k=d.toISOString().slice(0,10); if(log[k]){ n++; d.setDate(d.getDate()-1);} else break; } return n; }

function wireModule(key){ const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){
      x.done=!x.done;
      fetch(AI_API_BASE + "/api/todos/toggle", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id: x.id }) }).catch(()=>{});
    }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist(); });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
}

/* ---------- EDITOR MODAL (per type) ---------- */
function openEditor(key,item){
  const m=modOf(key); const editing=!!item; const d=item||newItem(m);
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：喝够 8 杯水"/></div>
      <p class="sub" style="margin:0">保存后可在卡片点击左侧方块打卡；连续天数自动统计，每天从零开始。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div><div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;min-width:auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else {
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto;min-width:auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }
  // layout variant selector
  const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
  fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;
  // custom fields (from m.fields config) — rendered after type-specific fields
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto;min-width:auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  // shared image URL field (all types)
  fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><h3>${editing?'编辑':'新建'} · ${m.name}</h3><div class="sub">${m.desc}</div>${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}<div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key,d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){ const base={id:Date.now()}; let item;
  if(m.type==="todo") item={...base,title:"",priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"),done:false,note:""};
  else if(m.type==="checkin") item={...base,title:"",log:{}};
  else if(m.type==="progress") item={...base,title:"",current:0,target:(m.unit==="页"?100:20),unit:m.unit||"",note:""};
  else if(m.type==="finance") item={...base,title:"",type:"expense",amount:"",category:(m.categories&&m.categories[0])||"其他",date:isoToday()};
  else item={...base,title:"",content:"",mood:(m.moods&&m.moods[0])||"",date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){ const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:400px"><h3>删除记录</h3><div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

async function dcApi(url, opts){
  const resp = await fetch(AI_API_BASE + url, opts);
  const d = await resp.json().catch(()=>({ok:false,error:"返回解析失败"}));
  if(!d.ok) throw new Error(d.error || "请求失败");
  return d;
}
const dcPost=(url,body)=>dcApi(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});

            +dBtn("⛔ 决定不做","decideDont","data-status='⛔决定不做'","border:1px solid #e0a5a5;background:#fbeeee;color:#b23b3b;")
            +dBtn("⏸ 暂缓","decideHold","data-status='⏸暂缓'")):""}
          ${dBtn("📝 回填复盘","review")}
          ${dBtn("🗑 删除此卡","deleteCard","","border:1px solid #e0a5a5;background:#fbeeee;color:#b23b3b;")}

        catch(e){ alert("删除失败："+e.message); }
      } else if(act==="review"){
        const c=prompt("这次决策事后复盘：当时判断对不对、为什么？","");

          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);margin:7px 0"><input type="checkbox" class="dp-advise" checked style="width:15px;height:15px"/>同时让 AI 给推进建议</label>

    card.querySelectorAll("[data-dact]").forEach(b=>b.onclick=async()=>{
      const act=b.dataset.dact;

      } else if(act==="adviseOnly"){
        b.disabled=true; b.textContent="体检中…";

/* ---------- 日程表（飞书「日程表」表，月历视图 + 选日看详情 + 快捷添加） ---------- */
async function renderSchedule(){
  const scr=$("#screen");
  scr.innerHTML=`<div class="panel" style="text-align:center;color:var(--text-tertiary);padding:60px 20px;font-size:14px">加载日程…</div>`;
  let items=[];
  try{
    const r=await fetch('/api/schedules').then(x=>x.json());
    if(!r.ok){ scr.innerHTML=`<div class="panel" style="text-align:center;color:#c25d4f;padding:60px 20px;font-size:14px">加载失败：${esc(r.error||'未知错误')}</div>`; return; }
    items=r.items||[];
  }catch(e){ scr.innerHTML=`<div class="panel" style="text-align:center;color:#c25d4f;padding:60px 20px;font-size:14px">网络错误：${esc(e.message)}</div>`; return; }
  const sdStr=x=>{
    const v=x.date;
    if(!v) return "";
    if(typeof v==="number"){ const d=new Date(v); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    return String(v).slice(0,10);
  };
  const byDate={};
  items.forEach(x=>{ const ds=sdStr(x); if(ds) (byDate[ds]=byDate[ds]||[]).push(x); });
  const now=new Date();
  let cm=window._sdMonth||(window._sdMonth={y:now.getFullYear(),m:now.getMonth()});
  let sd=window._sdDay||(window._sdDay=isoToday());
  function draw(){
    const y=cm.y, mo=cm.m;
    const startDow=new Date(y,mo,1).getDay();
    const days=new Date(y,mo+1,0).getDate();
    const todayIso=isoToday();
    let cells="";
    for(let i=0;i<startDow;i++) cells+=`<div style="aspect-ratio:1;border-radius:8px"></div>`;
    for(let d=1;d<=days;d++){
      const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const n=(byDate[ds]||[]).length;
      const isToday=ds===todayIso, isSel=ds===sd;
      cells+=`<button type="button" data-sdate="${ds}" style="position:relative;aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:600;cursor:pointer;border:1px solid ${n?'var(--module-1)':'var(--border)'};background:${n?'#eef3ec':'var(--surface-nested)'};color:${n?'var(--text)':'var(--text-secondary)'};${isToday?'box-shadow:inset 0 0 0 2px var(--accent);':''}${isSel?'outline:2px solid var(--module-1);outline-offset:-2px;':''}">${d}${n?`<span style="position:absolute;top:3px;right:4px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--module-1);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center">${n}</span>`:''}</button>`;
    }
    const dayItems=(byDate[sd]||[]).slice().sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));
    scr.innerHTML=`
      <div class="header"><div><h2>日程表</h2><p>每天的计划与安排 · 数据存飞书「日程表」</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
      <div class="panel">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <button class="btn ghost" id="sdPrev" style="padding:6px 12px">${icon("chevron",14,2)}上月</button>
          <span style="flex:1;text-align:center;font-weight:700">${y}年${mo+1}月</span>
          <button class="btn ghost" id="sdNext" style="padding:6px 12px">下月${icon("chevron",14,2)}</button>
          <button class="btn" data-upload="calendar" style="flex:0 0 auto;padding:6px 14px;font-size:13px" title="拍照/上传校历截图">${icon("camera",14)}校历</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--text-tertiary);font-weight:600;margin-bottom:6px">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${cells}</div>
        <div style="margin-top:12px;font-size:12px;color:var(--text-secondary)">本月共 ${Object.keys(byDate).filter(k=>k.startsWith(`${y}-${String(mo+1).padStart(2,'0')}`)).reduce((s,k)=>s+byDate[k].length,0)} 条日程 · 有日程的日期带绿点角标</div>
      </div>
      <div class="panel">
        <div class="panel-h"><span class="tic">${icon("calendar",16)}</span><div class="tt"><span class="en">${sd===todayIso?'TODAY':sd}</span><span class="zh">${sd===todayIso?'今天':sd}（${dayItems.length} 条）</span></div></div>
        ${dayItems.length?dayItems.map(x=>`<div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:baseline">
          <span style="flex:0 0 56px;font-weight:700;color:var(--module-1);font-size:14px">${esc(x.time||'—')}</span>
          <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(x.content)}</div>
          ${x.note?`<div style="font-size:12px;color:var(--text-tertiary);margin-top:2px">${esc(x.note)}</div>`:''}</div>
          <span style="flex:0 0 auto;font-size:12px;color:var(--text-tertiary)">${esc(x.source||'')}</span>
        </div>`).join(''):`<div style="text-align:center;color:var(--text-tertiary);padding:24px 0;font-size:14px">这一天还没有日程</div>`}
        <div style="display:flex;gap:8px;margin-top:16px">
          <input id="sdTime" type="time" style="flex:0 0 120px;padding:10px;border:1px solid var(--border-input);border-radius:10px;font-size:13px;background:var(--surface-card);color:var(--text)"/>
          <input id="sdContent" type="text" placeholder="这一天要做什么？" style="flex:1;min-width:0;padding:10px;border:1px solid var(--border-input);border-radius:10px;font-size:13px;background:var(--surface-card);color:var(--text)"/>
          <button class="btn" id="sdAdd">${icon("plus",13)}加</button>
        </div>
        <p style="margin:10px 0 0;font-size:12px;color:var(--text-tertiary)">💡 在 AI 助手聊天直接说「明天下午3点开会」会自动记入；发截图说「日程」也能识别。</p>
      </div>`;
    $("#sdPrev").onclick=()=>{ cm.m--; if(cm.m<0){cm.m=11;cm.y--;} draw(); };
    $("#sdNext").onclick=()=>{ cm.m++; if(cm.m>11){cm.m=0;cm.y++;} draw(); };
    scr.querySelectorAll("[data-sdate]").forEach(el=>el.onclick=()=>{ sd=el.dataset.sdate; window._sdDay=sd; draw(); });
    const btn=$("#sdAdd");
    if(btn) btn.onclick=async()=>{
      const content=($("#sdContent").value||"").trim();
      if(!content){ alert("先写点事项内容"); return; }
      const time=$("#sdTime").value||"";
      btn.disabled=true; btn.textContent="保存中…";
      try{
        const r=await fetch('/api/schedules',{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:sd,time,content,source:"✋手动"})});
        const j=await r.json();
        if(!j.ok){ alert("保存失败："+(j.error||"")); }
        else {
          const rr=await fetch('/api/schedules').then(x=>x.json());
          if(rr.ok){ items=rr.items||[]; Object.keys(byDate).forEach(k=>delete byDate[k]); items.forEach(x=>{ const ds=sdStr(x); if(ds) (byDate[ds]=byDate[ds]||[]).push(x); }); }
          draw();
        }
      }catch(e){ alert("网络错误："+e.message); }
      btn.disabled=false; btn.innerHTML=icon("plus",13)+"加";
    };
  }
  draw();
}

/* ---------- 书库（从知识资料表拉书卡，点开看完整内容） ---------- */
async function renderBooks(){
  const scr=$("#screen");
  scr.innerHTML=`<div class="panel" style="text-align:center;color:var(--text-tertiary);padding:60px 20px;font-size:14px">加载书库…</div>`;
  try{
    const r=await fetch('/api/knowledge/list?keyword='+encodeURIComponent('书卡·')).then(x=>x.json());
    if(!r.ok){ scr.innerHTML=`<div class="panel" style="text-align:center;color:#c25d4f;padding:60px 20px;font-size:14px">加载失败：${esc(r.error||'未知错误')}</div>`; return; }
    const books=r.items||[];
    if(!books.length){ scr.innerHTML=`<div class="panel" style="text-align:center;color:var(--text-tertiary);padding:60px 20px;font-size:14px">还没有书卡<br>聊天发「书卡：书名」生成第一张</div>`; return; }
    scr.innerHTML=`
      <div class="panel">
        <div class="panel-h"><span class="tic">${icon("target",16)}</span><div class="tt"><span class="en">BOOK LIBRARY</span><span class="zh">书库 · ${books.length} 本</span></div></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px">
          ${books.map(b=>`<div class="panel" style="cursor:pointer;padding:16px" data-bid="${b.recordId}">
            <div style="font-weight:700;font-size:15px;margin-bottom:4px">${esc(b.title.replace(/^书卡·/,''))}</div>
            <div style="font-size:12px;color:var(--text-tertiary)">${esc(b.author||'AI')} · ${esc(b.date||'')}</div>
            <div style="font-size:12.5px;color:var(--text-secondary);margin-top:8px;line-height:1.5;max-height:60px;overflow:hidden">${esc(b.summary||'').slice(0,120)}…</div>
          </div>`).join("")}
        </div>
      </div>`;
    scr.querySelectorAll("[data-bid]").forEach(el=>el.onclick=()=>{
      const b=books.find(x=>x.recordId===el.dataset.bid);
      if(!b) return;
      const modal=document.createElement("div");
      modal.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px";
      modal.innerHTML=`<div style="background:var(--surface-card);border-radius:16px;max-width:640px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;position:relative">
        <button style="position:absolute;top:12px;right:12px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--text-tertiary)" onclick="this.closest('div[style*=fixed]').remove()">✕</button>
        <div style="font-weight:800;font-size:18px;margin-bottom:4px">${esc(b.title.replace(/^书卡·/,''))}</div>
        <div style="font-size:12px;color:var(--text-tertiary);margin-bottom:16px">${esc(b.author||'AI')} · ${esc(b.date||'')}</div>
        <div style="font-size:14px;line-height:1.8;white-space:pre-wrap">${esc(b.knowledge||b.viewpoints||b.summary||'')}</div>
        <div style="margin-top:20px;text-align:right"><button id="bk-del" style="border:1px solid #e0a5a5;background:#fbeeee;color:#b23b3b;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer">🗑 删除这本书</button></div>
      </div>`;
      modal.onclick=e=>{ if(e.target===modal) modal.remove(); };
      modal.querySelector("#bk-del").onclick=async()=>{
        if(!confirm(`确定删除《${b.title.replace(/^书卡·/,'')}》吗？\n将从飞书知识资料表永久删除，不可恢复。`)) return;
        try{
          const r=await fetch('/api/knowledge/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recordId:b.recordId})}).then(x=>x.json());
          if(!r.ok) throw new Error(r.error||'删除失败');
          modal.remove(); renderBooks();
        }catch(e){ alert("删除失败："+e.message); }
      };
      document.body.appendChild(modal);
    });
  }catch(e){ scr.innerHTML=`<div class="panel" style="text-align:center;color:#c25d4f;padding:60px 20px;font-size:14px">加载失败：${esc(e.message)}</div>`; }
}

let aiSending = false;

(function initAiChat(){
  // 注入图标
  $("#aiTitleIcon").innerHTML = icon("bolt", 18);
  $("#aiClose").innerHTML = icon("close", 17);
  $("#aiSend").innerHTML = icon("plus", 14) + "发送";

  const overlay = $("#aiOverlay");
  const input = $("#aiInput");
  const sendBtn = $("#aiSend");
  const list = $("#aiList");
  const empty = $("#aiEmpty");

  // 打开/关闭
  window.openAiChat = function(){
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    setTimeout(()=>input.focus(), 30);
  };
  function closeAiChat(){ overlay.hidden = true; document.body.style.overflow = ""; }
  $("#aiClose").onclick = closeAiChat;
  document.addEventListener("keydown", e => {
    if(!overlay.hidden && e.key === "Escape") closeAiChat();
  });

  // 自适应高度
  function autoResize(){
    input.style.height = "auto";
    input.style.height = Math.min(120, input.scrollHeight) + "px";
  }
  input.addEventListener("input", () => {
    autoResize();
    sendBtn.disabled = !input.value.trim();
  });
  input.addEventListener("keydown", e => {
    if(e.isComposing || e.keyCode === 229) return;
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      aiSend();
    }
  });
  sendBtn.onclick = aiSend;

  function pushHistory(role, content){
    if(!content) return;
    aiHistory.push({ role, content });
    if(aiHistory.length > 20) aiHistory.splice(0, aiHistory.length - 20);
  }

  function addMsg(kind, text, tag, opts){
    opts = opts || {};
    if(empty) empty.style.display = "none";
    const div = document.createElement("div");
    div.className = "ai-msg " + kind;
    if(tag){ const t = document.createElement("span"); t.className="tag"; t.textContent = tag; div.appendChild(t); }
    if(opts.quote){
      const qb = document.createElement("div");
      qb.className = "chat-quote-block";
      qb.textContent = "「" + (opts.quote.length > 80 ? opts.quote.slice(0, 80) + "…" : opts.quote) + "」";
      div.appendChild(qb);
    }
    const body = document.createElement("div"); body.textContent = text; div.appendChild(body);
    if(opts.ts){
      const tm = document.createElement("span");
      tm.className = "ai-time";
      tm.textContent = fmtAiTime(opts.ts);
      div.appendChild(tm);
    }
    // 长按（触屏）/右键（电脑）→ 引用该条继续聊
    if(kind === "user" || kind === "assistant" || kind === "saved") wireAiQuote(div, text, opts.quote);
    if(opts.prepend){
      list.insertBefore(div, list.firstChild);
    } else {
      list.appendChild(div);
      list.scrollTop = list.scrollHeight;
    }
    return div;
  }
  window._chatAddMsg = addMsg;

  function fmtAiTime(ts){
    const d = new Date(ts);
    const p = (n) => (n < 10 ? "0" + n : "" + n);
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // ==== 长按消息 → 引用该段继续聊（触屏长按 500ms / 电脑右键） ====
  const aiQuoteBar = $("#aiQuoteBar");
  const aiQuoteTextEl = $("#aiQuoteText");
  function setAiQuote(display, content){
    aiQuoted = { display, content };
    if(aiQuoteBar && aiQuoteTextEl){
      aiQuoteTextEl.textContent = "引用：" + (display.length > 60 ? display.slice(0, 60) + "…" : display);
      aiQuoteBar.style.display = "flex";
    }
  }
  function clearAiQuote(){
    aiQuoted = null;
    if(aiQuoteBar) aiQuoteBar.style.display = "none";
  }
  const aiQuoteRemoveBtn = $("#aiQuoteRemove");
  if(aiQuoteRemoveBtn) aiQuoteRemoveBtn.onclick = clearAiQuote;

  function wireAiQuote(el, text, quote){
    if(!el) return;
    // 引用带引用块的旧消息时，把原引用一起带上，AI 上下文才完整
    const content = quote ? "[引用]「" + quote + "」\n" + text : text;
    let timer = null;
    const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
    const trigger = () => setAiQuote(text, content);
    el.addEventListener("contextmenu", (e) => { e.preventDefault(); trigger(); });
    el.addEventListener("touchstart", () => { timer = setTimeout(() => { timer = null; trigger(); }, 500); }, { passive: true });
    el.addEventListener("touchmove", cancel, { passive: true });
    el.addEventListener("touchend", cancel);
    el.addEventListener("touchcancel", cancel);
  }

  // ==== 历史记录：打开弹窗时加载最近50条，可继续往前翻 ====
  let aiLoadedCount = 0;
  let aiTotalCount = 0;
  let aiLoadingMore = false;

  function renderAiHistoryMsg(m, prepend){
    const kind = m.kind === "saved" ? "saved" : (m.role === "user" ? "user" : "assistant");
    const tag = kind === "user" ? "我" : (kind === "saved" ? "记录已存" : "AI");
    return addMsg(kind, m.text || "", tag, { prepend, quote: m.quote, ts: m.ts });
  }

  function renderAiLoadMoreBtn(){
    let btn = list.querySelector(".ai-load-more");
    const remain = aiTotalCount - aiLoadedCount;
    if(remain <= 0){ if(btn) btn.remove(); return; }
    if(!btn){
      btn = document.createElement("button");
      btn.className = "ai-load-more";
      btn.onclick = loadAiMoreHistory;
      list.insertBefore(btn, list.firstChild);
    }
    btn.textContent = "↑ 加载更早的消息（还有 " + remain + " 条）";
  }

  async function loadAiMoreHistory(){
    if(aiLoadingMore) return;
    aiLoadingMore = true;
    const btn = list.querySelector(".ai-load-more");
    if(btn) btn.disabled = true;
    try {
      const r = await fetch(AI_API_BASE + "/api/chat/history?limit=50&skip=" + aiLoadedCount);
      const d = await r.json();
      if(d.ok && Array.isArray(d.messages) && d.messages.length){
        const hBefore = list.scrollHeight, sBefore = list.scrollTop;
        for(let i = d.messages.length - 1; i >= 0; i--) renderAiHistoryMsg(d.messages[i], true);
        aiLoadedCount += d.messages.length;
        list.scrollTop = sBefore + (list.scrollHeight - hBefore);
        renderAiLoadMoreBtn();
      } else if(btn){
        btn.disabled = false;
      }
    } catch(e){
      if(btn) btn.disabled = false;
    }
    aiLoadingMore = false;
  }

  (async function loadAiHistory(){
    try {
      const r = await fetch(AI_API_BASE + "/api/chat/history?limit=50");
      const d = await r.json();
      if(d.ok && Array.isArray(d.messages) && d.messages.length){
        aiTotalCount = d.total || d.messages.length;
        d.messages.forEach((m) => renderAiHistoryMsg(m, false));
        aiLoadedCount = d.messages.length;
        renderAiLoadMoreBtn();
        // 重建多轮上下文：最近20条 user/assistant（记录卡不进上下文）
        aiHistory = d.messages
          .filter((m) => m.kind !== "saved" && (m.role === "user" || m.role === "assistant") && m.text)
          .slice(-20)
          .map((m) => ({ role: m.role, content: m.role === "user" && m.quote ? "[引用]「" + m.quote + "」\n" + m.text : m.text }));
      }
    } catch(e){ /* 历史加载失败不影响新聊天 */ }
  })();

  // 研究产出落库：把思考伙伴回答存进飞书「知识资料」表（后端按内容哈希幂等，重复保存跳过）
  function addResearchBtn(div, question, reply){
    if(!div || !reply) return;
    const btn = document.createElement("button");
    btn.textContent = "💾 存为研究资料";
    btn.style.cssText = "margin-top:6px;margin-right:6px;padding:2px 8px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-tertiary);cursor:pointer";
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "保存中…";
      try{
        const resp = await fetch(AI_API_BASE + "/api/thinking/save-research", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question || "", reply })
        });
        const d = await resp.json();
        if(d.ok) btn.textContent = d.duplicated ? "已在知识资料中" : "✅ 已存入知识资料";
        else { btn.textContent = "💾 存为研究资料（" + (d.error || "失败") + "）"; btn.disabled = false; }
      }catch(e){ btn.textContent = "💾 存为研究资料"; btn.disabled = false; }
    };
    div.appendChild(btn);
  }

  async function aiSend(){
    if(aiSending) return;
    const text = input.value.trim();
    if(!text) return;
    aiSending = true;
    sendBtn.disabled = true;
    const q = aiQuoted;
    input.value = ""; autoResize();
    clearAiQuote();
    addMsg("user", text, "我", q ? { quote: q.display } : undefined);
    // 引用内容拼进对话上下文给 AI；正文单独传后端，分类/存档不被引用污染
    pushHistory("user", q ? q.content : text);
    const loading = addMsg("loading", "思考中…");

    try {
      const resp = await fetch(AI_API_BASE + "/api/input", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, history: aiHistory, quote: q ? q.content : undefined }),
      });
      const data = await resp.json();
      loading.remove();
      if(!data.ok){
        addMsg("error", data.error || "请求失败", "错误");
        return;
      }
      if(data.mode === "chat"){
        const dv = addMsg("assistant", data.reply || "(空)", "AI");
        if(data.researchable) addResearchBtn(dv, data.research && data.research.question, (data.research && data.research.reply) || data.reply);
        if(data.meetingFlow){
          const fc = buildMeetingFlowCard(data.meetingFlow, AI_API_BASE, (t)=>{ input.value=t; autoResize(); sendBtn.disabled=false; input.focus(); });
          if(fc){ fc.className = "ai-msg assistant"; list.appendChild(fc); list.scrollTop = list.scrollHeight; }
        }
        if(data.breakdown){
          const bc = buildBreakdownCard(data.breakdown, AI_API_BASE);
          if(bc){ bc.className = "ai-msg assistant"; list.appendChild(bc); list.scrollTop = list.scrollHeight; }
        }
        pushHistory("assistant", data.reply || "");
      } else if(data.mode === "answer"){
        const dv = addMsg("assistant", data.reply || "(空回答)", "AI 回答");
        if(data.researchable) addResearchBtn(dv, data.research && data.research.question, (data.research && data.research.reply) || data.reply);
        pushHistory("assistant", data.reply || "");
      } else if(data.mode === "saved"){
        let body = `已保存为「${data.type}」\n标题：${data.title}\n目录：${data.dir}`;
        if(data.profileUpdated) body += `\n认知条目：+${data.profileItems} 条`;
        addMsg("saved", body, "记录已存" + (data.profileUpdated ? " · 认知+" + data.profileItems : ""));
        // 记录已落盘，下次问"还有什么"会被 readContext 读回，所以不进对话历史
      }
    } catch(e){
      loading.remove();
      addMsg("error", "无法连接 " + AI_API_BASE + " — 请确认 personal-ai-os 已启动 (cd personal-ai-os && npm start)", "连接失败");
    } finally {
      aiSending = false;
      sendBtn.disabled = !input.value.trim();
      input.focus();
    }
  }

  // ==== 语音对话：🎙 录音 → /api/ask/voice → 浏览器朗读回复 ====
  const micBtn = $("#aiMic");
  micBtn.textContent = "🎙";

  function chatSessionId(){
    let s = localStorage.getItem("aiChatSession");
    if(!s){
      s = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      localStorage.setItem("aiChatSession", s);
    }
    return s;
  }
  function speak(text){
    if(localStorage.getItem("aiSpeak") === "off" || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      speechSynthesis.speak(u);
    }catch(e){}
  }

  let mediaStream = null, recorder = null, chunks = [], recording = false, recordingMsg = null;
  micBtn.onclick = async () => {
    if(recording){
      recording = false;
      micBtn.textContent = "🎙"; micBtn.style.background = "";
      if(recordingMsg){ recordingMsg.remove(); recordingMsg = null; }
      try{ recorder.stop(); }catch(e){}
      mediaStream.getTracks().forEach(t => t.stop());
      return;
    }
    if(!navigator.mediaDevices || !window.MediaRecorder){
      addMsg("error", "此环境不支持录音：需 Chrome/Edge，且页面为 localhost 或已在 chrome://flags 放行", "提示");
      return;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }catch(e){
      addMsg("error", "麦克风权限被拒绝：请在浏览器地址栏的权限请求里允许麦克风", "提示");
      return;
    }
    chunks = [];
    const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
    recorder = new MediaRecorder(mediaStream, mime ? { mimeType: mime } : undefined);
    recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: mime || "audio/webm" });
      if(blob.size < 2000){ addMsg("error", "录音太短，没收到声音", "提示"); return; }
      const thinking = addMsg("loading", "语音识别中…");
      try{
        const resp = await fetch(AI_API_BASE + "/api/ask/voice", {
          method: "POST",
          headers: { "Content-Type": blob.type || "audio/webm", "X-Chat-Session": chatSessionId() },
          body: blob,
        });
        const data = await resp.json();
        thinking.remove();
        if(!data.ok){ addMsg("error", data.error || "识别失败", "提示"); return; }
        addMsg("user", data.userText, "我说");
        if(data.mode === "saved"){
          let body = `已保存为「${data.type}」\n标题：${data.title}`;
          if(data.profileUpdated) body += `\n认知条目：+${data.profileItems} 条`;
          addMsg("saved", body, "记录已存");
          speak(`已保存为${data.type}，标题，${data.title}`);
        } else {
          speak(data.reply);
          addMsg("assistant", data.reply || "(空)", data.mode === "answer" ? "AI 回答" : "AI");
          pushHistory("user", data.userText);
          pushHistory("assistant", data.reply || "");
        }
      }catch(e){
        thinking.remove();
        addMsg("error", "语音服务连接失败，请确认服务已启动", "连接失败");
      }
    };
    recorder.start();
    recording = true;
    micBtn.textContent = "⏹";
    micBtn.style.background = "#e5484d";
    recordingMsg = addMsg("loading", "🎙 录音中…说完再点一下结束");
  };
})();

/* ============================================================
   AI 助手 · 历史记录 — 显示 personal-ai-os 的认知条目
   ============================================================ */
(function initCogEngine(){
  $("#cogTitleIcon").innerHTML = icon("star", 18);
  $("#cogClose").innerHTML = icon("close", 17);

  const overlay = $("#cogOverlay");
  const list = $("#cogList");
  const countEl = $("#cogCount");
  const refreshBtn = $("#cogRefresh");

  window.openCog = function(){
    overlay.hidden = false;
    refreshCount();
    loadEntries();
  };
  function closeCog(){ overlay.hidden = true; }
  $("#cogClose").onclick = closeCog;
  overlay.addEventListener("click", e => { if(e.target === overlay) closeCog(); });
  document.addEventListener("keydown", e => {
    if(!overlay.hidden && e.key === "Escape") closeCog();
  });
  if(refreshBtn) refreshBtn.onclick = loadEntries;

  // 条目列表
  async function refreshCount(){
    try {
      const resp = await fetch(AI_API_BASE + "/api/profile-updates");
      const data = await resp.json();
      if(data.ok) countEl.textContent = "· " + (data.entries||[]).length;
      else countEl.textContent = "· 0";
    } catch(e){ countEl.textContent = "· ?"; }
  }

  async function loadEntries(){
    list.innerHTML = '<div class="cog-empty">加载中…</div>';
    countEl.textContent = "—";
    try {
      const resp = await fetch(AI_API_BASE + "/api/profile-updates");
      const data = await resp.json();
      if(!data.ok){
        list.innerHTML = `<div class="cog-err">${escapeHtml(data.error || "加载失败")}</div>`;
        return;
      }
      const entries = data.entries || [];
      countEl.textContent = "· " + entries.length;
      if(entries.length === 0){
        list.innerHTML = '<div class="cog-empty">暂无 AI 助手记录。<br>跟 AI 助手说"我决定…"之类的，会自动生成认知条目。</div>';
        return;
      }
      list.innerHTML = "";
      for(const e of entries){
        const div = document.createElement("div");
        div.className = "cog-entry";
        const head = document.createElement("div");
        head.className = "cog-time";
        const timeSpan = document.createElement("span");
        timeSpan.textContent = e.time || "(无时间)";
        head.appendChild(timeSpan);
        const delBtn = document.createElement("button");
        delBtn.className = "cog-del";
        delBtn.textContent = "删除";
        delBtn.onclick = () => deleteEntry(e.id, div);
        head.appendChild(delBtn);
        div.appendChild(head);
        const body = document.createElement("div");
        body.className = "cog-body";
        body.textContent = (e.text || "").replace(/^##\s+.*$/m, "").replace(/^---$/m, "").trim();
        div.appendChild(body);
        list.appendChild(div);
      }
    } catch(err){
      list.innerHTML = `<div class="cog-err">无法连接 ${AI_API_BASE}<br>请确认 personal-ai-os 已启动 (cd personal-ai-os && npm start)</div>`;
    }
  }

  async function deleteEntry(id, entryEl){
    if(!confirm("确定删除此条记录？")) return;
    try {
      const resp = await fetch(AI_API_BASE + "/api/profile-updates/" + id, { method: "DELETE" });
      const data = await resp.json();
      if(!data.ok){
        alert(data.error || "删除失败");
        return;
      }
      entryEl.remove();
      const n = list.querySelectorAll(".cog-entry").length;
      countEl.textContent = "· " + n;
      if(n === 0){
        list.innerHTML = '<div class="cog-empty">已清空。</div>';
      }
    } catch(err){
      alert("网络错误：" + err.message);
    }
  }

  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
})();
</script>
</body>
</html>
