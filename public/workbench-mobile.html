  root.querySelectorAll("[data-scal]").forEach(el=>el.onclick=()=>{
    const now=new Date(); let y=schedMonth?schedMonth.y:now.getFullYear(), mo=schedMonth?schedMonth.m:now.getMonth();
    if(el.dataset.scal==="prev"){ mo--; if(mo<0){mo=11;y--;} } else { mo++; if(mo>11){mo=0;y++;} }
    schedMonth={y,m:mo}; renderSchedulePage(modOf("schedule"));
  });
  root.querySelectorAll("[data-sdate]").forEach(el=>el.onclick=()=>{ schedDay=el.dataset.sdate; renderSchedulePage(modOf("schedule")); });
  const btn=$("#schedAdd");
  if(btn) btn.onclick=async()=>{
    const content=($("#schedContent").value||"").trim();
    if(!content){ alert("先写点事项内容"); return; }
    const time=$("#schedTime").value||"";
    btn.disabled=true; btn.textContent="保存中…";
    try{
      const r=await fetch(API_BASE+"/api/schedules",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:schedDay,time,content,source:"✋手动"})});
      const j=await r.json();
      if(!j.ok){ alert("保存失败："+(j.error||"")); btn.disabled=false; btn.innerHTML=icon("plus",13)+"加"; }
      else { await loadSchedules(); renderSchedulePage(modOf("schedule")); }
    }catch(e){ alert("网络错误："+e.message); btn.disabled=false; btn.innerHTML=icon("plus",13)+"加"; }
  };
}

function wireHome(){
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
}

/* ---------- 首页嵌入式聊天（单一入口，后端自动判断记录/提问/对话） ---------- */
let homeAIHistory = [];         // 多轮对话历史，最多 10 轮（20 条）
let homeChatSending = false;
let homePendingImage = "";      // 已选好待发送的图片 base64（压缩后）
let homeQuoted = null;          // 长按引用的消息 { display: 展示文本, content: 给 AI 的完整上下文 }

function wireHomeChat(){
  const sendBtn = $("#homeChatSend");
  const input = $("#homeChatInput");
  const list = $("#homeChatList");
  if(!sendBtn || !input || !list) return;

  // 注入图标
  const iconSpan = $("#homeChatIcon");
  if(iconSpan) iconSpan.innerHTML = icon("bolt", 16);
  sendBtn.innerHTML = icon("plus", 13) + "发送";

  function autoResize(){
    input.style.height = "auto";
    input.style.height = Math.min(110, input.scrollHeight) + "px";
  }
  function refreshSendBtn(){
    sendBtn.disabled = !(input.value.trim() || homePendingImage);
  }
  input.addEventListener("input", () => {
    autoResize();
    refreshSendBtn();
  });
  input.addEventListener("keydown", e => {
    // IME 组合输入（中文输入法候选上屏）时不拦截
    if(e.isComposing || e.keyCode === 229) return;
    // Enter 发送；Shift+Enter 换行（走浏览器默认行为）
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      homeSend();
    }
  });
  sendBtn.onclick = homeSend;

  function copyText(t){
    // HTTP 非 localhost 时 clipboard API 可能不可用，用 textarea 兜底
    try {
      const ta = document.createElement("textarea");
      ta.value = t;
      ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      return true;
    } catch(e){ return false; }
  }

  function addMsg(kind, text, tag, opts){
    opts = opts || {};
    const empty = list.querySelector(".chat-empty");
    if(empty) empty.remove();
    const div = document.createElement("div");
    div.className = "chat-msg " + kind;
    if(tag){ const t = document.createElement("span"); t.className="tag"; t.textContent = tag; div.appendChild(t); }
    if(opts.quote){
      const qb = document.createElement("div");
      qb.className = "chat-quote-block";
      qb.textContent = "「" + (opts.quote.length > 80 ? opts.quote.slice(0, 80) + "…" : opts.quote) + "」";
      div.appendChild(qb);
    }
    const body = document.createElement("div"); body.textContent = text; div.appendChild(body);
    // AI 回答/存记录卡片底部加「复制」按钮，方便把结果拿走
    if(kind === "assistant" || kind === "saved"){
      const btn = document.createElement("button");
      btn.textContent = "📋 复制";
      btn.style.cssText = "margin-top:6px;padding:2px 8px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-tertiary);cursor:pointer";
      btn.onclick = () => { if(copyText(text)){ btn.textContent = "已复制"; setTimeout(()=>{ btn.textContent = "📋 复制"; }, 1200); } };
      div.appendChild(btn);
    }
    if(opts.ts){
      const tm = document.createElement("span");
      tm.className = "chat-time";
      tm.textContent = fmtChatTime(opts.ts);
      div.appendChild(tm);
    }
    // 长按（手机）/右键（电脑）→ 引用该条继续聊
    if(kind === "user" || kind === "assistant" || kind === "saved") wireQuote(div, text, opts.quote);
    if(opts.prepend){
      list.insertBefore(div, list.firstChild);
    } else {
      list.appendChild(div);
      list.scrollTop = list.scrollHeight;
    }
    return div;
  }
  window._chatAddMsg = addMsg;

  function fmtChatTime(ts){
    const d = new Date(ts);
    const p = (n) => (n < 10 ? "0" + n : "" + n);
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // ==== 长按消息 → 引用该段继续聊（手机长按 500ms / 电脑右键） ====
  const quoteBar = $("#homeChatQuoteBar");
  const quoteTextEl = $("#homeChatQuoteText");
  function setQuote(display, content){
    homeQuoted = { display, content };
    if(quoteBar && quoteTextEl){
      quoteTextEl.textContent = "引用：" + (display.length > 60 ? display.slice(0, 60) + "…" : display);
      quoteBar.style.display = "flex";
    }
  }
  function clearQuote(){
    homeQuoted = null;
    if(quoteBar) quoteBar.style.display = "none";
  }
  const quoteRemoveBtn = $("#homeChatQuoteRemove");
  if(quoteRemoveBtn) quoteRemoveBtn.onclick = clearQuote;

  function wireQuote(el, text, quote){
    if(!el) return;
    // 引用带引用块的旧消息时，把原引用一起带上，AI 上下文才完整
    const content = quote ? "[引用]「" + quote + "」\n" + text : text;
    let timer = null;
    const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
    const trigger = () => setQuote(text, content);
    el.addEventListener("contextmenu", (e) => { e.preventDefault(); trigger(); });
    el.addEventListener("touchstart", () => { timer = setTimeout(() => { timer = null; trigger(); }, 500); }, { passive: true });
    el.addEventListener("touchmove", cancel, { passive: true });
    el.addEventListener("touchend", cancel);
    el.addEventListener("touchcancel", cancel);
  }

  // ==== 历史记录：打开时加载最近50条，可继续往前翻 ====
  let chatLoadedCount = 0;
  let chatTotalCount = 0;
  let chatLoadingMore = false;

  function renderHistoryMsg(m, prepend){
    const kind = m.kind === "saved" ? "saved" : (m.role === "user" ? "user" : "assistant");
    const tag = kind === "user" ? "我" : (kind === "saved" ? "记录已存" : "AI");
    return addMsg(kind, m.text || "", tag, { prepend, quote: m.quote, ts: m.ts });
  }

  function renderLoadMoreBtn(){
    let btn = list.querySelector(".chat-load-more");
    const remain = chatTotalCount - chatLoadedCount;
    if(remain <= 0){ if(btn) btn.remove(); return; }
    if(!btn){
      btn = document.createElement("button");
      btn.className = "chat-load-more";
      btn.onclick = loadMoreHistory;
      list.insertBefore(btn, list.firstChild);
    }
    btn.textContent = "↑ 加载更早的消息（还有 " + remain + " 条）";
  }

  async function loadMoreHistory(){
    if(chatLoadingMore) return;
    chatLoadingMore = true;
    const btn = list.querySelector(".chat-load-more");
    if(btn) btn.disabled = true;
    try {
      const r = await fetch(API_BASE + "/api/chat/history?limit=50&skip=" + chatLoadedCount);
      const d = await r.json();
      if(d.ok && Array.isArray(d.messages) && d.messages.length){
        const hBefore = list.scrollHeight, sBefore = list.scrollTop;
        for(let i = d.messages.length - 1; i >= 0; i--) renderHistoryMsg(d.messages[i], true);
        chatLoadedCount += d.messages.length;
        list.scrollTop = sBefore + (list.scrollHeight - hBefore);
        renderLoadMoreBtn();
      } else if(btn){
        btn.disabled = false;
      }
    } catch(e){
      if(btn) btn.disabled = false;
    }
    chatLoadingMore = false;
  }

  (async function loadChatHistory(){
    try {
      const r = await fetch(API_BASE + "/api/chat/history?limit=50");
      const d = await r.json();
      if(d.ok && Array.isArray(d.messages) && d.messages.length){
        chatTotalCount = d.total || d.messages.length;
        d.messages.forEach((m) => renderHistoryMsg(m, false));
        chatLoadedCount = d.messages.length;
        renderLoadMoreBtn();
        // 重建多轮上下文：最近20条 user/assistant（记录卡不进上下文）
        homeAIHistory = d.messages
          .filter((m) => m.kind !== "saved" && (m.role === "user" || m.role === "assistant") && m.text)
          .slice(-20)
          .map((m) => ({ role: m.role, content: m.role === "user" && m.quote ? "[引用]「" + m.quote + "」\n" + m.text : m.text }));
      }
    } catch(e){ /* 历史加载失败不影响新聊天 */ }
  })();

  // ==== 会后回流候选卡片：用户点按钮才写决策卡/项目卡，绝不自动入库 ====
  function renderMeetingFlow(flow){
    if(!flow || !flow.id) return;
    const empty = list.querySelector(".chat-empty"); if(empty) empty.remove();
    const card = document.createElement("div");
    card.className = "chat-msg assistant";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "会后回流 · 待你确认"; card.appendChild(tag);
    const btnCss = "margin:4px 4px 0 0;padding:5px 10px;font-size:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg,#fff);color:var(--text-secondary);cursor:pointer";
    function addSection(title, lines){
      if(!lines || !lines.length) return;
      const h = document.createElement("div");
      h.style.cssText = "margin:6px 0 2px;font-size:12px;color:var(--text-tertiary)";
      h.textContent = title;
      card.appendChild(h);
      lines.forEach((line, i) => {
        const row = document.createElement("div");
        row.textContent = (typeof line === "string" ? line : line.decision);
        row.style.cssText = "font-size:13px;margin:2px 0;color:var(--text-primary)";
        card.appendChild(row);
        const btns = document.createElement("div");
        if(typeof line === "object" && line.decision){
          const b1 = document.createElement("button");
          b1.textContent = "✅ 记入决策卡"; b1.style.cssText = btnCss;
          b1.onclick = async () => {
            b1.disabled = true; b1.textContent = "归档中…";
            try{
              const r = await fetch(API_BASE + "/api/meetings/apply-flow", {
                method:"POST", headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ flowId: flow.id, action:"decision", index: i }),
              }).then((x)=>x.json());
              if(r.ok){ b1.textContent = "已入决策卡 ✅"; b1.style.color = "#16a34a"; }
              else { b1.disabled = false; b1.textContent = "失败，重试"; alert(r.error || "归档失败"); }
            }catch(e){ b1.disabled=false; b1.textContent="失败，重试"; }
          };
          btns.appendChild(b1);
        } else {
          const bq = document.createElement("button");
          bq.textContent = "⚖️ 发起决策尽调"; bq.style.cssText = btnCss;
          bq.onclick = () => {
            input.value = "决策：" + line;
            autoResize(); refreshSendBtn(); input.focus();
          };
          btns.appendChild(bq);
        }
        card.appendChild(btns);
      });
    }
    addSection("会上已拍板（点确认直接进决策卡，状态=✅决定做）", flow.decisions);
    addSection("悬而未决（填入聊天框，我来做十维尽调）", flow.openQuestions);
    if(flow.projects && flow.projects.length){
      const h = document.createElement("div");
      h.style.cssText = "margin:6px 0 2px;font-size:12px;color:var(--text-tertiary)";
      h.textContent = "关联项目（把会议决定追加为项目进展，不改项目状态）";
      card.appendChild(h);
      flow.projects.forEach((p) => {
        const b = document.createElement("button");
        b.textContent = "📝 追加进展到《" + p.name + "》"; b.style.cssText = btnCss;
        b.onclick = async () => {
          b.disabled = true; b.textContent = "追加中…";
          try{
            const r = await fetch(API_BASE + "/api/meetings/apply-flow", {
              method:"POST", headers:{"Content-Type":"application/json"},
              body: JSON.stringify({ flowId: flow.id, action:"progress", projectRecordId: p.recordId }),
            }).then((x)=>x.json());
            if(r.ok){ b.textContent = "已追加到《" + p.name + "》 ✅"; b.style.color = "#16a34a"; }
            else { b.disabled=false; b.textContent="失败，重试"; alert(r.error || "追加失败"); }
          }catch(e){ b.disabled=false; b.textContent="失败，重试"; }
        };
        card.appendChild(b);
      });
    }
    list.appendChild(card);
    list.scrollTop = list.scrollHeight;
  }

  // 项目任务拆解确认卡：用户点按钮才写入「任务计划」表，绝不自动入库
  function renderBreakdown(flow){
    if(!flow || !flow.id) return;
    const empty = list.querySelector(".chat-empty"); if(empty) empty.remove();
    const card = document.createElement("div");
    card.className = "chat-msg assistant";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "任务拆解 · 待你确认"; card.appendChild(tag);
    const info = document.createElement("div");
    info.style.cssText = "margin:6px 0 2px;font-size:13px;color:var(--text-primary)";
    info.textContent = "《" + flow.projectName + "》· " + flow.count + " 条带验收标准的任务，确认后写入「任务计划」表";
    card.appendChild(info);
    const btn = document.createElement("button");
    btn.style.cssText = "margin:4px 4px 0 0;padding:5px 10px;font-size:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg,#fff);color:var(--text-secondary);cursor:pointer";
    btn.textContent = "✅ 确认写入任务计划";
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "写入中…";
      try{
        const r = await fetch(API_BASE + "/api/tasks/breakdown/apply", {
          method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id: flow.id }),
        }).then((x)=>x.json());
        if(!r.ok) throw new Error(r.error || "请求失败");
        btn.textContent = "已写入 " + r.created + " 条 ✅"; btn.style.color = "#16a34a";
      }catch(e){ btn.disabled = false; btn.textContent = "失败，重试"; alert(e.message); }
    };
    card.appendChild(btn);
    list.appendChild(card);
    list.scrollTop = list.scrollHeight;
  }

  // 研究产出落库：把思考伙伴回答存进飞书「知识资料」表（后端按内容哈希幂等，重复保存跳过）
  function addResearchBtn(div, question, reply){
    if(!div || !reply) return;
    const btn = document.createElement("button");
    btn.textContent = "💾 存为研究资料";
    btn.style.cssText = "margin-top:6px;margin-right:6px;padding:2px 8px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-tertiary);cursor:pointer";
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "保存中…";
      try{
        const resp = await fetch(API_BASE + "/api/thinking/save-research", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question || "", reply })
        });
        const d = await resp.json();
        if(d.ok) btn.textContent = d.duplicated ? "已在知识资料中" : "✅ 已存入知识资料";
        else { btn.textContent = "💾 存为研究资料（" + (d.error || "失败") + "）"; btn.disabled = false; }
      }catch(e){ btn.textContent = "💾 存为研究资料"; btn.disabled = false; }
    };
    div.appendChild(btn);
  }

  async function homeSend(){
    if(homeChatSending) return;
    const text = input.value.trim();
    if(!text) return;
    homeChatSending = true;
    sendBtn.disabled = true;
    const q = homeQuoted;
    input.value = ""; autoResize();
    clearQuote();
    addMsg("user", text, "我", q ? { quote: q.display } : undefined);
    // 引用内容拼进对话上下文给 AI；正文单独传后端，分类/存档不被引用污染
    homeAIHistory.push({ role: "user", content: q ? q.content : text });
    if(homeAIHistory.length > 20) homeAIHistory.splice(0, homeAIHistory.length - 20);
    const loading = addMsg("loading", "思考中…");

    try {
      // 统一走 /api/input：后端 classify 三分支（记录/提问/对话）自动判断
      const resp = await fetch(API_BASE + "/api/input", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, history: homeAIHistory, quote: q ? q.content : undefined }),
      });
      const data2 = await resp.json();
      loading.remove();
      if(!data2.ok){
        addMsg("error", data2.error || "请求失败", "错误");
        homeAIHistory.pop();
        return;
      }
      if(data2.mode === "chat"){
        // 视频收录回执：渲染评价卡片；其他对话回应：不存，AI 接话
        if(data2.video){
          renderVideoReceipt(data2.reply || "(空)", data2.video);
        }else{
          const dv = addMsg("assistant", data2.reply || "(空)", "AI");
          if(data2.researchable) addResearchBtn(dv, data2.research && data2.research.question, (data2.research && data2.research.reply) || data2.reply);
        }
        if(data2.meetingFlow) renderMeetingFlow(data2.meetingFlow);
        if(data2.breakdown) renderBreakdown(data2.breakdown);
        homeAIHistory.push({ role: "assistant", content: data2.reply || "" });
      } else if(data2.mode === "answer"){
        // 提问：读上下文回答，不存
        const dv = addMsg("assistant", data2.reply || "(空回答)", "AI 回答");
        if(data2.researchable) addResearchBtn(dv, data2.research && data2.research.question, (data2.research && data2.research.reply) || data2.reply);
        homeAIHistory.push({ role: "assistant", content: data2.reply || "" });
      } else if(data2.mode === "saved"){
        // 记录：存盘 + 认知条目+1 + 自动提取待办
        let body = `已保存为「${data2.type}」\n标题：${data2.title}\n目录：${data2.dir}`;
        if(data2.profileUpdated) body += `\n认知条目：+${data2.profileItems} 条`;
        addMsg("saved", body, "记录已存" + (data2.profileUpdated ? " · 认知+" + data2.profileItems : ""));

        try {
          const er = await fetch(API_BASE + "/api/extract-todos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          const ed = await er.json();
          if(ed.ok && ed.todos && ed.todos.length > 0){
            data.todo = data.todo || [];
            for(const t of ed.todos){
              data.todo.push({
                id: Date.now() + Math.floor(Math.random()*10000),
                title: t.text,
                priority: t.priority || "P2",
                done: false,
                note: ""
              });
            }
            store.save();
            let msg = `+${ed.todos.length} 条待办已自动加入「今日计划」。`;
            if(ed.aiTasks > 0) msg += `\n其中 ${ed.aiTasks} 条已自动派发 AI 执行，结果见「任务计划」表。`;
            addMsg("saved", msg, "AI 助手 · 自动提取");
          }
        } catch(ex){
          // 提取失败静默
        }
      }
      if(homeAIHistory.length > 20) homeAIHistory.splice(0, homeAIHistory.length - 20);
    } catch(e){
      loading.remove();
      addMsg("error", "无法连接 " + API_BASE + " — 请确认 personal-ai-os 已启动 (cd personal-ai-os && npm start)", "连接失败");
      homeAIHistory.pop();
    } finally {
      homeChatSending = false;
      refreshSendBtn();
      input.focus();
    }
  }

  // ==== 图片输入：🖼 选图 → 挂到输入框上方预览 → 可写描述/提问 → 发送时图片+文字一起走 ====
  const imgInput = $("#homeChatImageInput");
  const imgPreview = $("#homeChatImagePreview");
  const imgThumb = $("#homeChatImageThumb");
  const imgRemove = $("#homeChatImageRemove");

  function clearPendingImage(){
    homePendingImage = "";
    if(imgPreview) imgPreview.style.display = "none";
    if(imgThumb) imgThumb.src = "";
    if(imgInput) imgInput.value = "";
    refreshSendBtn();
  }
  if(imgRemove) imgRemove.onclick = clearPendingImage;

  if(imgInput){
    imgInput.onchange = async (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try {
        const base64 = await readImageCompressed(file);
        if(!base64) throw new Error("读文件失败");
        homePendingImage = base64;
        if(imgThumb) imgThumb.src = base64.startsWith("data:") ? base64 : ("data:image/jpeg;base64," + base64);
        if(imgPreview) imgPreview.style.display = "flex";
        input.placeholder = "描述一下图片，或对图片提问…";
        refreshSendBtn();
        input.focus();
        // 全局上传入口：截图记账/校历 → 自动带提示词直接发送
        const kind = imgInput.dataset.kind;
        if(kind){
          imgInput.dataset.kind = "";
          input.value = kind === 'ledger' ? '记账' : '日程';
          autoResize(); refreshSendBtn();
          setTimeout(() => homeSend(), 50);
        }
      } catch(err){
        addMsg("error", "读取图片失败：" + err.message, "错误");
        imgInput.value = "";
      }
    };
  }

  // 全局上传入口：data-upload="ledger|calendar" 触发聊天图片通道，自动带提示词
  document.addEventListener('click', function(e){
    const btn = e.target.closest('[data-upload]');
    if(!btn) return;
    e.preventDefault();
    const kind = btn.dataset.upload;
    const gInput = document.getElementById('globalUploadInput');
    if(!gInput) return;
    gInput.dataset.kind = kind;
    gInput.click();
  }, true);

  // 全局上传 input：选图后按 kind 自动发送
  (function(){
    const gInput = document.getElementById('globalUploadInput');
    if(!gInput) return;
    gInput.onchange = async function(e){
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const kind = gInput.dataset.kind || '';
      gInput.dataset.kind = '';
      gInput.value = '';
      try {
        const base64 = await readImageCompressed(file);
        if(!base64) throw new Error('读文件失败');
        if(kind === 'calendar'){
          const resp = await fetch(API_BASE + '/api/schedules/image', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64 }),
          });
          const j = await resp.json();
          if(!j.ok){ alert(j.error || '没识别出日程'); return; }
          alert((j.count > 1)
            ? ('📅 已记入 ' + j.added + ' 条日程' + (j.skipped ? '（跳过重复 ' + j.skipped + ' 条）' : ''))
            : ('📅 已记入日程表：' + j.parsed.date + (j.parsed.time ? ' ' + j.parsed.time : '') + ' · ' + j.parsed.content));
          if(view === 'schedule') renderSchedule();
        } else if(kind === 'ledger'){
          const resp = await fetch(API_BASE + '/api/input/image', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64, prompt: '记账' }),
          });
          const j = await resp.json();
          if(!j.ok){ alert(j.error || '识别失败'); return; }
          if(j.mode === 'chat' && j.reply){
            // 跳到 AI 助手页展示候选气泡（用户可直接回「存」）
            view = 'aichat'; render();
            setTimeout(() => {
              if(window._chatAddMsg) window._chatAddMsg('assistant', j.reply, '记账候选');
            }, 150);
          } else {
            alert('识别完成：' + (j.recognizedText || '').slice(0, 120));
          }
        }
      } catch(err){ alert('处理失败：' + err.message); }
    };
  })();

  // 发送：有待发送图片时走 /api/input/image（可带 prompt），否则走普通文本
  const textOnlySend = homeSend;
  homeSend = async function(){
    if(homeChatSending) return;
    if(!homePendingImage){ return textOnlySend(); }
    const prompt = input.value.trim();
    // 日程识别快捷通道：发图+「日程」→ 直接走 /api/schedules/image 落飞书日程表
    if(/^(日程|记日程|加入日程|加到日程)/.test(prompt)){
      homeChatSending = true;
      sendBtn.disabled = true;
      input.value = ""; autoResize();
      const imageData = homePendingImage;
      const previewSrc = imageData.startsWith("data:") ? imageData : ("data:image/jpeg;base64," + imageData);
      clearPendingImage();
      input.placeholder = "说点什么… Enter 发送，Shift+Enter 换行";
      const userDiv = addMsg("user", "🖼 " + (prompt || "(未附描述)"), "我");
      const thumb = document.createElement("img");
      thumb.src = previewSrc;
      thumb.style.cssText = "max-width:160px;border-radius:8px;display:block;margin-top:4px";
      userDiv.appendChild(thumb);
      list.scrollTop = list.scrollHeight;
      const loading = addMsg("loading", "识别日程中…");
      try{
        const resp = await fetch(API_BASE + "/api/schedules/image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: imageData }),
        });
        const j = await resp.json();
        loading.remove();
        if(!j.ok){ addMsg("error", j.error || "没识别出日程", "日程"); }
        else {
          addMsg("saved", (j.count > 1)
            ? `📅 已记入 ${j.added} 条日程${j.skipped ? `（跳过重复 ${j.skipped} 条）` : ''}`
            : `📅 已记入日程表：${j.parsed.date}${j.parsed.time ? ' ' + j.parsed.time : ''} · ${j.parsed.content}`, "日程已存");
          loadSchedules();
        }
      }catch(err){
        loading.remove();
        addMsg("error", "无法连接 " + API_BASE, "连接失败");
      }finally{
        homeChatSending = false;
        refreshSendBtn();
      }
      return;
    }
    homeChatSending = true;
    sendBtn.disabled = true;
    input.value = ""; autoResize();
    const imageData = homePendingImage;
    const previewSrc = imageData.startsWith("data:") ? imageData : ("data:image/jpeg;base64," + imageData);
    clearPendingImage();
    input.placeholder = "说点什么… Enter 发送，Shift+Enter 换行";

    // 用户消息：图片 + 描述
    const userDiv = addMsg("user", prompt ? "🖼 " + prompt : "🖼 (未附描述)", "我");
    const thumb = document.createElement("img");
    thumb.src = previewSrc;
    thumb.style.cssText = "max-width:160px;border-radius:8px;display:block;margin-top:4px";
    userDiv.appendChild(thumb);
    list.scrollTop = list.scrollHeight;
    homeAIHistory.push({ role: "user", content: prompt ? "[图片] " + prompt : "[图片]" });
    if(homeAIHistory.length > 20) homeAIHistory.splice(0, homeAIHistory.length - 20);
    const loading = addMsg("loading", "识别图片中…");

    try {
      const resp = await fetch(API_BASE + "/api/input/image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageData, prompt, history: homeAIHistory }),
      });
      const data2 = await resp.json();
      loading.remove();
      if(!data2.ok){
        addMsg("error", data2.error || "识别失败", "错误");
        homeAIHistory.pop();
        return;
      }
      const recog = data2.recognizedText || "";
      if(data2.mode === "chat"){
        addMsg("assistant", data2.reply || "(空)", "AI");
        homeAIHistory.push({ role: "assistant", content: data2.reply || "" });
      } else if(data2.mode === "answer"){
        addMsg("assistant", data2.reply || "(空回答)", "AI 回答");
        homeAIHistory.push({ role: "assistant", content: data2.reply || "" });
      } else if(data2.mode === "saved"){
        let body = `已保存为「${data2.type}」\n标题：${data2.title}\n目录：${data2.dir}`;
        if(recog) body += `\n识别：${recog.slice(0, 120)}${recog.length > 120 ? "…" : ""}`;
        if(data2.profileUpdated) body += `\n认知条目：+${data2.profileItems} 条`;
        addMsg("saved", body, "记录已存" + (data2.profileUpdated ? " · 认知+" + data2.profileItems : ""));
      }
      if(homeAIHistory.length > 20) homeAIHistory.splice(0, homeAIHistory.length - 20);
    } catch(err){
      loading.remove();
      addMsg("error", "无法连接 " + API_BASE, "连接失败");
      homeAIHistory.pop();
    } finally {
      homeChatSending = false;
      refreshSendBtn();
    }
  };
  sendBtn.onclick = homeSend;

  // ==== 视频评价：收录后下一条消息即评价；@ 或「换一条」选其他视频；回执卡片可随时点「评价这条」 ====
  let commentTarget = null; // { url, recordId, title }
  const commentChip = $("#homeCommentChip");
  const commentTitleEl = $("#homeCommentTitle");
  const videoPicker = $("#homeVideoPicker");

  function setCommentTarget(t){
    if(!t || (!t.url && !t.recordId)) return;
    commentTarget = t;
    if(commentTitleEl) commentTitleEl.textContent = t.title || "这条视频";
    if(commentChip) commentChip.style.display = "flex";
    if(videoPicker) videoPicker.style.display = "none";
    input.placeholder = "写下你的评价，直接发送…（点右侧✕恢复正常聊天）";
    input.focus();
  }
  function clearCommentTarget(){
    commentTarget = null;
    if(commentChip) commentChip.style.display = "none";
    if(videoPicker) videoPicker.style.display = "none";
    input.placeholder = "说点什么… Enter 发送，Shift+Enter 换行";
  }
  $("#homeCommentCancel").onclick = clearCommentTarget;
  $("#homeCommentSwitch").onclick = () => openVideoPicker();

  async function openVideoPicker(){
    if(!videoPicker) return;
    videoPicker.style.display = "block";
    videoPicker.innerHTML = '<div style="padding:14px;text-align:center;font-size:12px;color:var(--ink-muted)">加载中…</div>';
    try{
      const resp = await fetch(API_BASE + "/api/videos/recent?limit=8");
      const d = await resp.json();
      const items = (d && d.items) || [];
      if(!items.length){
        videoPicker.innerHTML = '<div style="padding:14px;text-align:center;font-size:12px;color:var(--ink-muted)">表格里还没有视频，先收录一条吧</div>';
        return;
      }
      let html = '<div style="padding:8px 12px;font-size:11px;color:var(--ink-muted);border-bottom:1px solid var(--border)">选择要评价的视频</div>';
      items.forEach((it, i) => {
        const t = String(it.title || "未命名").replace(/[<>&"]/g, s => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[s]));
        const tag = it.cluster ? `<span style="font-size:10px;color:#2b5cb8;background:#eef4ff;border-radius:4px;padding:1px 5px;margin-left:6px">${it.cluster}</span>` : "";
        html += `<div data-pi="${i}" style="padding:10px 12px;font-size:12.5px;border-bottom:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t}${tag}</div>`;
      });
      videoPicker.innerHTML = html;
      videoPicker.querySelectorAll("[data-pi]").forEach((el) => {
        el.onclick = () => {
          const it = items[Number(el.getAttribute("data-pi"))];
          setCommentTarget({ url: it.url, recordId: it.recordId, title: it.title });
        };
      });
    }catch(e){
      videoPicker.innerHTML = '<div style="padding:14px;text-align:center;font-size:12px;color:#c0392b">加载失败：' + String(e.message || e) + '</div>';
    }
  }

  // 输入 @ 结尾时弹出视频选择（选择后 @ 字符自动去掉）
  input.addEventListener("input", () => {
    const v = input.value;
    if(/@\s*$/.test(v)){
      input.value = v.replace(/@\s*$/, "");
      autoResize();
      openVideoPicker();
    }
  });

  async function sendVideoComment(text){
    homeChatSending = true;
    sendBtn.disabled = true;
    input.value = ""; autoResize();
    addMsg("user", text, "我的评价");
    const target = commentTarget;
    const loading = addMsg("loading", "写入评价…");
    try{
      const resp = await fetch(API_BASE + "/api/videos/comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: target.url, recordId: target.recordId, text }),
      });
      const d = await resp.json();
      loading.remove();
      if(!d.ok){
        addMsg("error", d.error || "评价写入失败", "错误");
      }else{
        addMsg("saved", `✅ 评价已记录到《${d.title || target.title || "视频"}》，飞书表「我的评价」列可查看。`, "评价已存");
        clearCommentTarget();
      }
    }catch(e){
      loading.remove();
      addMsg("error", "无法连接服务，评价未保存", "错误");
    }finally{
      homeChatSending = false;
      refreshSendBtn();
      input.focus();
    }
  }

  // 视频收录回执：特殊卡片 + 「💬 评价这条」按钮，并自动挂上评价上下文
  function renderVideoReceipt(text, video){
    const div = addMsg("assistant", text, "视频收录");
    if(video && (video.url || video.recordId)){
      const btn = document.createElement("button");
      btn.textContent = "💬 评价这条";
      btn.style.cssText = "margin-top:6px;margin-right:6px;padding:2px 10px;font-size:11px;border:1px solid #c7dbff;border-radius:6px;background:#eef4ff;color:#2b5cb8;cursor:pointer";
      btn.onclick = () => setCommentTarget({ url: video.url || "", recordId: video.recordId || "", title: video.title || "这条视频" });
      div.appendChild(btn);
      // 收录/查重回执一到，自动进入"下一条即评价"状态
      setCommentTarget({ url: video.url || "", recordId: video.recordId || "", title: video.title || "这条视频" });
    }
    return div;
  }

  // ============ 快捷指令面板（⚡）：点按钮→填前缀或拉列表点选，零后端改动 ============
  // 命令清单与 lib/router.js 各 handle*Command 正则一一对应
  (function(){
    let overlay = null;
    const CSS = '.qc-mask{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:900;display:flex;align-items:flex-end;justify-content:center}'
      + '.qc-panel{background:#fff;border-radius:16px 16px 0 0;max-width:520px;width:100%;max-height:72vh;overflow-y:auto;padding:14px 14px 20px;box-sizing:border-box}'
      + '.qc-title{font-size:13px;color:#667;font-weight:600;margin:2px 2px 10px}'
      + '.qc-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid #e5eaf2;background:#f8fafd;border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:14px;color:#123;box-sizing:border-box}'
      + '.qc-item:hover{background:#eef4ff}.qc-item b{font-size:14px}.qc-item i{display:block;font-style:normal;font-size:12px;color:#889;margin-top:2px}'
      + '.qc-ico{font-size:18px;flex:none}.qc-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}'
      + '.qc-chip{border:1px solid #c9d8f2;background:#fff;color:#2b5cb8;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}'
      + '.qc-chip:hover{background:#eef4ff}.qc-back{border:none;background:none;color:#2b5cb8;font-size:13px;cursor:pointer;padding:0 2px;margin-bottom:8px}'
      + '.qc-empty{font-size:13px;color:#889;padding:6px 2px}';
    if (!document.getElementById('qcStyle')) {
      const s = document.createElement('style'); s.id = 'qcStyle'; s.textContent = CSS; document.head.appendChild(s);
    }
    function close() { if (overlay) { overlay.remove(); overlay = null; } }
    function open(input) {
      close();
      overlay = document.createElement('div');
      overlay.className = 'qc-mask';
      overlay.onclick = (e) => { if (e.target === overlay) close(); };
      const panel = document.createElement('div');
      panel.className = 'qc-panel';
      overlay.appendChild(panel);
      function fill(text) { input.value = text; input.focus(); try { input.setSelectionRange(text.length, text.length); } catch (e) {} close(); }
      function row(ico, title, sub, onClick) {
        const b = document.createElement('button');
        b.className = 'qc-item';
        b.innerHTML = '<span class="qc-ico">' + ico + '</span><span><b>' + title + '</b>' + (sub ? '<i>' + sub + '</i>' : '') + '</span>';
        b.onclick = onClick;
        panel.appendChild(b);
      }
      function menuHome() {
        panel.innerHTML = '<div class="qc-title">⚡ 快捷指令 <span style="color:#aab;font-weight:400">（点选后自动填入，补完内容按 Enter 发送）</span></div>';
        row('🔍', '想学东西', '研究快讯 / 深度研究 / 两样对比', menuStudy);
        row('📋', '拆任务：项目', '把项目拆成带验收标准的任务', menuProjects);
        row('⚖️', '立项：已拍板的决策', '决策卡转项目卡', menuDecisions);
        row('🧠', '记经验', '把感悟存进经验卡', () => fill('记经验：'));
        row('📚', '书卡', '查开放书库 + AI 拆书卡', () => fill('书卡：'));
        row('📖', '命令速查', '忘了都有什么命令？', () => fill('帮助'));
      }
      function withBack(title, backFn) {
        panel.innerHTML = '<button class="qc-back">‹ 返回</button><div class="qc-title">' + title + '</div>';
        panel.querySelector('.qc-back').onclick = backFn;
      }
      function menuStudy() {
        withBack('🔍 想学东西', menuHome);
        row('⚡', '研究快讯', '快速了解一个话题', () => fill('研究快讯：'));
        row('🔬', '深度研究', '深入分析（可存知识库）', () => fill('研究：'));
        row('⚖️', '对比研究', '两样东西对比', () => fill('对比：A vs B'));
      }
      function chips(list) {
        const wrap = document.createElement('div');
        wrap.className = 'qc-chips';
        list.forEach((x) => {
          const c = document.createElement('button');
          c.className = 'qc-chip';
          c.textContent = x.label;
          c.onclick = () => fill(x.fill);
          wrap.appendChild(c);
        });
        panel.appendChild(wrap);
      }
      async function menuProjects() {
        withBack('📋 拆任务：选一个项目', menuHome);
        const tip = document.createElement('div'); tip.className = 'qc-empty'; tip.textContent = '加载项目列表…'; panel.appendChild(tip);
        try {
          const r = await fetch('/api/projects/list').then((x) => x.json());
          const items = (r.items || r.projects || []).filter((p) => p.name);
          tip.remove();
          if (!items.length) { tip.textContent = '还没有项目卡。可以先发「决策：要不要做X」尽调拍板，或「新建项目：名称」。'; panel.appendChild(tip); return; }
          chips(items.slice(0, 30).map((p) => ({ label: String(p.name).slice(0, 22), fill: '拆任务：' + p.name })));
        } catch (e) { tip.textContent = '项目列表加载失败：' + e.message; }
      }
      async function menuDecisions() {
        withBack('⚖️ 立项：选已拍板的决策', menuHome);
        const tip = document.createElement('div'); tip.className = 'qc-empty'; tip.textContent = '加载决策卡…'; panel.appendChild(tip);
        try {
          const r = await fetch('/api/decisions/list').then((x) => x.json());
          const items = (r.items || r.decisions || []).filter((d) => String(d.status || '').includes('✅') && d.question);
          tip.remove();
          if (!items.length) { tip.textContent = '还没有 ✅决定做 的决策卡。先发「决策：要不要做X」做尽调，拍板后再来立项。'; panel.appendChild(tip); return; }
          chips(items.slice(0, 30).map((d) => ({ label: String(d.question).slice(0, 22), fill: '立项：' + d.question })));
        } catch (e) { tip.textContent = '决策卡加载失败：' + e.message; }
      }
      menuHome();
      document.body.appendChild(overlay);
    }
    const qbtn = document.getElementById('homeChatQuick'), qinput = document.getElementById('homeChatInput');
    if (qbtn && qinput) qbtn.onclick = () => (overlay ? close() : open(qinput));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  })();

  // 最外层拦截：挂着评价目标时，文字消息走评价接口（不经过 AI 分类）
  const prevHomeSend = homeSend;
  homeSend = function(){
    if(homeChatSending) return;
    if(commentTarget && !homePendingImage){
      const t = input.value.trim();
      if(t) return sendVideoComment(t);
      return;
    }
    return prevHomeSend.apply(this, arguments);
  };
  sendBtn.onclick = homeSend;

  // ==== 语音对话：🎙 录音 → /api/ask/voice → 浏览器朗读回复 ====
  const micBtn = $("#homeChatMic");
  micBtn.textContent = "🎙";

  function chatSessionId(){
    let s = localStorage.getItem("aiChatSession");
    if(!s){
      s = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      localStorage.setItem("aiChatSession", s);
    }
    return s;
  }
  function speak(text){
    if(localStorage.getItem("aiSpeak") === "off" || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      speechSynthesis.speak(u);
    }catch(e){}
  }

  let mediaStream = null, recorder = null, chunks = [], recording = false, recordingMsg = null;
  micBtn.onclick = async () => {
    if(recording){
      recording = false;
      micBtn.textContent = "🎙"; micBtn.style.background = "";
      if(recordingMsg){ recordingMsg.remove(); recordingMsg = null; }
      try{ recorder.stop(); }catch(e){}
      mediaStream.getTracks().forEach(t => t.stop());
      return;
    }
    if(!navigator.mediaDevices || !window.MediaRecorder){
      // http + 非 localhost 时浏览器禁用麦克风：iPhone 无解，安卓可 chrome://flags 放行
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      const tip = isIOS
        ? "iPhone 浏览器需 HTTPS 才能录音。当前可用方案：用飞书 App 录音，把妙记链接粘到下方整理。"
        : "安卓可用：浏览器地址栏输入 chrome://flags，搜索 insecure，把 http://" + location.host + " 加进「Insecure origins treated as secure」并启用，重启浏览器即可录音。或直接用飞书 App 录音贴妙记链接。";
      addMsg("error", tip, "提示");
      return;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }catch(e){
      addMsg("error", "麦克风权限被拒绝：请在浏览器设置里允许此页面使用麦克风", "提示");
      return;
    }
    chunks = [];
    const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
    recorder = new MediaRecorder(mediaStream, mime ? { mimeType: mime } : undefined);
    recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: mime || "audio/webm" });
      if(blob.size < 2000){ addMsg("error", "录音太短，没收到声音", "提示"); return; }
      const thinking = addMsg("loading", "语音识别中…");
      try{
        const resp = await fetch(API_BASE + "/api/ask/voice", {
          method: "POST",
          headers: { "Content-Type": blob.type || "audio/webm", "X-Chat-Session": chatSessionId() },
          body: blob,
        });
        const vdata = await resp.json();
        thinking.remove();
        if(!vdata.ok){ addMsg("error", vdata.error || "识别失败", "提示"); return; }
        addMsg("user", vdata.userText, "我说");
        if(vdata.mode === "saved"){
          let body = `已保存为「${vdata.type}」\n标题：${vdata.title}`;
          if(vdata.profileUpdated) body += `\n认知条目：+${vdata.profileItems} 条`;
          addMsg("saved", body, "记录已存");
          speak(`已保存为${vdata.type}，标题，${vdata.title}`);
        } else {
          speak(vdata.reply);
          addMsg("assistant", vdata.reply || "(空)", vdata.mode === "answer" ? "AI 回答" : "AI");
          homeAIHistory.push({ role: "user", content: vdata.userText }, { role: "assistant", content: vdata.reply || "" });
          if(homeAIHistory.length > 20) homeAIHistory.splice(0, homeAIHistory.length - 20);
        }
      }catch(e){
        thinking.remove();
        addMsg("error", "语音服务连接失败，请确认服务已启动", "连接失败");
      }
    };
    recorder.start();
    recording = true;
    micBtn.textContent = "⏹";
    micBtn.style.background = "#e5484d";
    recordingMsg = addMsg("loading", "🎙 录音中…说完再点一下结束");
  };
}

/* ---------- 我的评价独立页：全部视频 · 按话题簇筛选 · 随时补评 ---------- */
const REVIEW_CLUSTERS = ["AI与第二大脑","认知与决策","搞钱与周期","家庭与教育","高校生存","个人成长"];
let rvItems = [];          // 全部视频缓存
let rvCluster = "";        // 当前簇筛选，"" = 全部
let rvOnlyUnrated = false; // 只看未评价
let rvTab = "videos";      // 当前 tab："videos" 视频评价 | "exp" 经验复盘
let rvScores = {};         // url -> 已提交星级（1-5，0/undefined = 未评），页面会话内记忆
let expItems = [];         // 经验卡片缓存
let expType = "";          // 经验类型筛选："" = 全部 / ✅加分行为 / ❌减分行为 / 🟡中性观察

async function renderReviews(){

async function loadReviews(){
  const bar = document.getElementById("rvFilterBar");
  const list = document.getElementById("rvList");
  if(!bar || !list) return;
  try{
    const resp = await fetch(API_BASE + "/api/videos/recent?limit=200");
    const d = await resp.json();
    if(!d.ok) throw new Error(d.error || "加载失败");
    rvItems = d.items || [];
    // 用后端返回的 rating 初始化星级缓存，刷新页面后已评的星星显示实心
    rvItems.forEach(it => { if(it.rating > 0) rvScores[it.url] = it.rating; });
  }catch(e){
    bar.textContent = "加载失败：" + e.message;
    return;
  }
  paintReviews();
}

function esc1(s){
  return String(s == null ? "" : s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
}

function paintReviews(){
  const bar = document.getElementById("rvFilterBar");
  const list = document.getElementById("rvList");
  if(!bar || !list) return;

  const total = rvItems.length;
  const rated = rvItems.filter(x => x.hasComment).length;
  const clusterCounts = {};
  rvItems.forEach(x => { if(x.cluster) clusterCounts[x.cluster] = (clusterCounts[x.cluster]||0) + 1; });

  // 筛选条：全部 + 有视频的簇 + 只看未评开关
  const chip = (key, label, n) => {
    const active = rvCluster === key;
    return `<span data-rvc="${esc1(key)}" style="display:inline-block;padding:4px 11px;margin:3px 5px 3px 0;border-radius:14px;font-size:12px;cursor:pointer;${active ? "background:#2b5cb8;color:#fff" : "background:var(--surface-card);color:var(--text);border:1px solid var(--border)"}">${esc1(label)}${n != null ? ` ${n}` : ""}</span>`;
  };
  let barHtml = `<div style="margin-bottom:6px">已评 <b style="color:#2b5cb8">${rated}</b> / ${total} 条</div><div style="line-height:2">`;
  barHtml += chip("", "全部", total);
  REVIEW_CLUSTERS.forEach(c => { if(clusterCounts[c]) barHtml += chip(c, c, clusterCounts[c]); });
  barHtml += `</div><label style="display:flex;align-items:center;gap:6px;margin-top:4px;cursor:pointer">
    <input type="checkbox" id="rvOnlyUnrated" ${rvOnlyUnrated ? "checked" : ""} style="width:15px;height:15px"/>
    只看未评价（${total - rated} 条）</label>`;
  bar.innerHTML = barHtml;
  bar.querySelectorAll("[data-rvc]").forEach(el => {
    el.onclick = () => { rvCluster = el.getAttribute("data-rvc") || ""; paintReviews(); };
  });
  const cb = document.getElementById("rvOnlyUnrated");
  if(cb) cb.onchange = () => { rvOnlyUnrated = cb.checked; paintReviews(); };

  // 列表：未评价优先，其次按收录时间倒序（rvItems 本身已是倒序）
  let items = rvItems.filter(x => (!rvCluster || x.cluster === rvCluster) && (!rvOnlyUnrated || !x.hasComment));
  items = items.slice().sort((a, b) => (a.hasComment === b.hasComment ? 0 : a.hasComment ? 1 : -1));
  // 星级排序：有评分的在前按分数降序，未评分的在后保持原序（稳定排序）
  items = items.slice().sort((a, b) => ((rvScores[b.url] || 0) - (rvScores[a.url] || 0)));

  if(!items.length){
    list.innerHTML = `<div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:40px 20px;line-height:1.8">${total ? "这个筛选下没有未评价的视频 👍" : "还没有收录任何视频"}</div>`;
    return;
  }

  list.innerHTML = items.map((it) => {
    const tags = [
      it.cluster ? `<span style="font-size:10px;color:#2b5cb8;background:#eef4ff;border-radius:4px;padding:1px 6px">${esc1(it.cluster)}</span>` : "",
      it.level ? `<span style="font-size:10px;color:var(--text-tertiary);background:var(--surface-card);border:1px solid var(--border);border-radius:4px;padding:1px 6px">${esc1(it.level)}</span>` : "",
    ].join(" ");
    const link = it.url ? `<a href="${esc1(it.url)}" target="_blank" style="color:var(--text-tertiary);font-size:11px;text-decoration:none;margin-left:6px">原视频↗</a>` : "";
    const head = `<div style="font-size:13.5px;font-weight:600;line-height:1.45">${esc1(it.title)}${link}</div>
      <div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">${tags}</div>`;
    const starline = it.url
      ? `<div style="margin-top:8px;display:flex;align-items:center;gap:2px;flex-wrap:wrap"><span style="font-size:11.5px;color:var(--text-tertiary);margin-right:3px">值得模仿</span>${rvStarRowHtml(it.url, rvScores[it.url] || 0)}</div>`
      : "";
    const body = it.hasComment
      ? `<div style="margin-top:8px;padding:8px 10px;background:var(--page-bg);border-radius:8px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;color:var(--text)">${esc1(it.comment)}</div>
         <div style="margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
           <button data-rvadd="${esc1(it.recordId)}" style="padding:3px 10px;font-size:11.5px;border:1px solid var(--border);border-radius:7px;background:transparent;color:#2b5cb8;cursor:pointer">➕ 再补一条</button>
           <button data-rvtoexp="${esc1(it.recordId)}" style="padding:3px 10px;font-size:11.5px;border:1px solid var(--border);border-radius:7px;background:transparent;color:#2b5cb8;cursor:pointer">→ 经验</button>
           <span class="rv-exp-msg" style="font-size:11px;color:#1f7a3d"></span>
         </div>`
      : `<div style="margin-top:8px;font-size:12px;color:#c47f17">✍️ 还没评价</div>
         <button data-rvadd="${esc1(it.recordId)}" style="margin-top:6px;padding:4px 12px;font-size:12px;border:1px solid #c7dbff;border-radius:7px;background:#eef4ff;color:#2b5cb8;cursor:pointer">✍️ 写评价</button>`;
    return `<div class="card" data-rvcard="${esc1(it.recordId)}" style="padding:12px">${head}${starline}${body}</div>`;
  }).join("");

  list.querySelectorAll("[data-rvadd]").forEach(btn => {
    btn.onclick = () => openRvEditor(btn.getAttribute("data-rvadd"));
  });
  // 星级评分 / 评价转经验：事件委托（星星更新会替换行内 HTML，委托避免重复绑定）
  list.onclick = (e) => {
    const star = e.target.closest("[data-rvstar]");
    if(star){ rateVideo(star.getAttribute("data-rvstar"), +star.getAttribute("data-n")); return; }
    const toexp = e.target.closest("[data-rvtoexp]");
    if(toexp) sendReviewToExp(toexp.getAttribute("data-rvtoexp"));
  };
}

// 评价框语音输入：点「🎙 语音」开始录、再点结束 → /api/asr/transcribe → 追加到文本框
function attachDictationMic(btn, textarea, msgEl, apiBase){
  let mediaStream=null, recorder=null, chunks=[], recording=false;
  const setIdle = () => { btn.disabled=false; btn.textContent="🎙 语音"; btn.style.background=""; btn.style.color="#2b5cb8"; btn.style.borderColor="#c7dbff"; };
  btn.onclick = async () => {
    if(recording){
      recording=false; setIdle();
      try{ recorder.stop(); }catch(e){}
      if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
      return;
    }
    if(!navigator.mediaDevices || !window.MediaRecorder){
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      if(msgEl){ msgEl.style.color="#c47f17";
        msgEl.textContent = isIOS
          ? "iPhone 浏览器需 HTTPS 才能录音，可用飞书妙记录音后贴链接。"
          : "安卓：地址栏进 chrome://flags 搜 insecure，把 http://"+location.host+" 加进「Insecure origins treated as secure」启用后重启浏览器。"; }
      return;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      if(msgEl){ msgEl.style.color="#c0392b"; msgEl.textContent="麦克风权限被拒绝，请在浏览器设置里允许"; }
      return;
    }
    chunks=[];
    const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
    recorder = new MediaRecorder(mediaStream, mime?{mimeType:mime}:undefined);
    recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, {type: mime || "audio/webm"});
      if(blob.size < 2000){ if(msgEl){ msgEl.style.color="#c0392b"; msgEl.textContent="录音太短，没收到声音"; } return; }
      btn.disabled=true; btn.textContent="识别中…"; btn.style.background=""; btn.style.color="#2b5cb8";
      if(msgEl){ msgEl.style.color="#2b5cb8"; msgEl.textContent="语音识别中…"; }
      try{
        const resp = await fetch(apiBase + "/api/asr/transcribe", { method:"POST", headers:{"Content-Type": blob.type||"audio/webm"}, body: blob });
        const d = await resp.json();
        if(!d.ok) throw new Error(d.error||"转写失败");
        const cur = textarea.value.trim();
        textarea.value = cur ? cur + " " + d.text : d.text;
        textarea.focus();
        if(msgEl){ msgEl.style.color="#2b5cb8"; msgEl.textContent="✅ 已转文字，可编辑或再点🎙说一段"; }
      }catch(e){
        if(msgEl){ msgEl.style.color="#c0392b"; msgEl.textContent=e.message; }
      }finally{ setIdle(); }
    };
    recorder.start();
    recording=true;
    btn.textContent="⏹ 结束"; btn.style.background="#e5484d"; btn.style.color="#fff"; btn.style.borderColor="#e5484d"; btn.disabled=false;
    if(msgEl){ msgEl.style.color="#c0392b"; msgEl.textContent="● 正在录音，再点一下结束"; }
  };
}

function openRvEditor(recordId){
  const card = document.querySelector(`[data-rvcard="${CSS.escape(recordId)}"]`);
  if(!card) return;
  const oldBtn = card.querySelector("[data-rvadd]");
  if(oldBtn) oldBtn.style.display = "none";
  const wrap = document.createElement("div");
  wrap.style.cssText = "margin-top:8px";
  wrap.innerHTML = `
    <textarea rows="3" placeholder="写下你的看法…（直接存飞书表，AI 不改写）" style="width:100%;padding:8px;border:1px solid #c7dbff;border-radius:9px;font-size:13px;font-family:inherit;resize:vertical;box-sizing:border-box"></textarea>
    <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="rv-save" style="padding:5px 14px;font-size:12.5px;border:none;border-radius:7px;background:#2b5cb8;color:#fff;cursor:pointer">保存评价</button>
      <button class="rv-mic" style="padding:5px 12px;font-size:12.5px;border:1px solid #c7dbff;border-radius:7px;background:transparent;color:#2b5cb8;cursor:pointer">🎙 语音</button>
      <button class="rv-cancel" style="padding:5px 14px;font-size:12.5px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text-tertiary);cursor:pointer">取消</button>
      <span class="rv-msg" style="font-size:11.5px;color:#c0392b;align-self:center"></span>
    </div>`;
  card.appendChild(wrap);
  const ta = wrap.querySelector("textarea");
  const msg = wrap.querySelector(".rv-msg");
  attachDictationMic(wrap.querySelector(".rv-mic"), ta, msg, API_BASE);
  ta.focus();
  wrap.querySelector(".rv-cancel").onclick = () => { wrap.remove(); if(oldBtn) oldBtn.style.display = ""; };
  wrap.querySelector(".rv-save").onclick = async () => {
    const text = ta.value.trim();
    if(!text){ msg.style.color="#c0392b"; msg.textContent = "内容为空"; return; }
    const saveBtn = wrap.querySelector(".rv-save");
    saveBtn.disabled = true; saveBtn.textContent = "保存中…";
    try{
      const resp = await fetch(API_BASE + "/api/videos/comment", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ recordId, text }),
      });
      const d = await resp.json();
      if(!d.ok) throw new Error(d.error || "保存失败");
      // 本地更新缓存后重绘
      const it = rvItems.find(x => x.recordId === recordId);
      if(it){
        const stamp = (() => { const dt = new Date(Date.now() + 8*3600*1000); const p = n => String(n).padStart(2,"0");
          return `${p(dt.getUTCMonth()+1)}-${p(dt.getUTCDate())} ${p(dt.getUTCHours())}:${p(dt.getUTCMinutes())}`; })();
        const block = `【${stamp}】${text}`;
        it.comment = it.comment ? `${it.comment}\n\n${block}` : block;
        it.hasComment = true;
      }
      paintReviews();
    }catch(e){
      msg.style.color="#c0392b"; msg.textContent = e.message;
      saveBtn.disabled = false; saveBtn.textContent = "保存评价";
    }
  };
}

/* ---------- 评价页 Tab 切换 + 星级评分 + 评价转经验 + 经验复盘 ---------- */
function switchRvTab(tab){
  rvTab = tab;
  const tv = document.getElementById("rvTabVideos"), te = document.getElementById("rvTabExp");
  if(!tv || !te) return;
  tv.style.display = tab === "exp" ? "none" : "";
  te.style.display = tab === "exp" ? "" : "none";
  document.querySelectorAll("[data-rvtab]").forEach(el => {
    const active = (el.getAttribute("data-rvtab") || "videos") === tab;
    el.style.background = active ? "#2b5cb8" : "var(--surface-card)";
    el.style.color = active ? "#fff" : "var(--text)";
    el.style.border = "1px solid " + (active ? "#2b5cb8" : "var(--border)");
  });
  if(tab === "exp") loadExperiences();
}

function rvStarRowHtml(url, score){
  let stars = "";
  for(let n = 1; n <= 5; n++){
    const on = n <= score;
    stars += `<span data-rvstar="${esc1(url)}" data-n="${n}" style="cursor:pointer;font-size:16px;line-height:1;padding:0 1px;color:${on ? "#f5a623" : "#c9c9c4"}">${on ? "★" : "☆"}</span>`;
  }
  return `<span data-rvstars="${esc1(url)}" style="display:inline-flex;align-items:center;flex-wrap:wrap">${stars}<span class="rv-score-msg" style="font-size:11px;color:#1f7a3d;margin-left:6px">${score ? "已评 " + score + " 星" : ""}</span></span>`;
}

function paintStarsFor(url){
  const html = rvStarRowHtml(url, rvScores[url] || 0);
  document.querySelectorAll("[data-rvstars]").forEach(el => {
    if(el.getAttribute("data-rvstars") === url) el.outerHTML = html;
  });
}

// 点第 N 颗星提交；再点当前分数的同一颗星 = 清除
async function rateVideo(url, n){
  const next = (rvScores[url] || 0) === n ? 0 : n;
  try{
    const resp = await fetch(API_BASE + "/api/videos/rate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, score: next }),
    });
    const d = await resp.json();
    if(!d.ok) throw new Error(d.error || "评分失败");
    rvScores[url] = next;
    paintStarsFor(url);
    if(!next){
      document.querySelectorAll("[data-rvstars]").forEach(el => {
        if(el.getAttribute("data-rvstars") !== url) return;
        const m = el.querySelector(".rv-score-msg");
        if(m) m.textContent = "已清除";
      });
    }
  }catch(e){
    document.querySelectorAll("[data-rvstars]").forEach(el => {
      if(el.getAttribute("data-rvstars") !== url) return;
      const m = el.querySelector(".rv-score-msg");
      if(m){ m.style.color = "#c0392b"; m.textContent = e.message; }
    });
  }
}

async function sendReviewToExp(recordId){
  const it = rvItems.find(x => x.recordId === recordId);
  if(!it || !it.comment) return;
  let btn = null, msg = null;
  document.querySelectorAll("[data-rvcard]").forEach(card => {
    if(card.getAttribute("data-rvcard") !== recordId) return;
    btn = card.querySelector("[data-rvtoexp]");
    msg = card.querySelector(".rv-exp-msg");
  });
  if(!btn) return;
  btn.disabled = true; btn.textContent = "入库中…";
  try{
    const resp = await fetch(API_BASE + "/api/experience/from-review", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: it.comment, videoTitle: it.title || "", cluster: it.cluster || "" }),
    });
    const d = await resp.json();
    if(!d.ok) throw new Error(d.error || "入库失败");
    btn.textContent = "✓ 已入库";
    if(msg) msg.textContent = "已存入经验复盘，AI 已归类";
  }catch(e){
    btn.disabled = false; btn.textContent = "→ 经验";
    if(msg){ msg.style.color = "#c0392b"; msg.textContent = e.message; }
  }
}

async function loadExperiences(){
  const bar = document.getElementById("expFilterBar");
  const list = document.getElementById("expList");
  if(!bar || !list) return;
  try{
    const resp = await fetch(API_BASE + "/api/experience/list");
    const d = await resp.json();
    if(!d.ok) throw new Error(d.error || "加载失败");
    expItems = d.items || [];
  }catch(e){
    bar.textContent = "加载失败：" + e.message;
    return;
  }
  paintExperiences();
}

function expCardHtml(it){
  const tone = it.type === "✅加分行为" ? { c:"#1f7a3d", bg:"#eaf7ee", bd:"#bfe3c8" }
    : it.type === "❌减分行为" ? { c:"#c0392b", bg:"#fdeeed", bd:"#f3c6c1" }
    : { c:"#8a6d1a", bg:"#faf6e8", bd:"#e6d9a8" };
  const tag = (t, color, bg, bd) => `<span style="font-size:10px;color:${color};background:${bg};border:1px solid ${bd};border-radius:4px;padding:1px 6px">${esc1(t)}</span>`;
  const level = it.level === "🔥核心原则"
    ? `<span style="font-size:10px;color:#c0392b;background:#fdeeed;border:1px solid #f3c6c1;border-radius:4px;padding:1px 6px;font-weight:600">🔥核心原则</span>`
    : (it.level ? `<span style="font-size:10px;color:var(--text-tertiary);background:var(--surface-card);border:1px solid var(--border);border-radius:4px;padding:1px 6px">${esc1(it.level)}</span>` : "");
  const vt = it.videoTitle ? (it.videoTitle.length > 22 ? it.videoTitle.slice(0, 22) + "…" : it.videoTitle) : "";
  const metas = [
    it.category ? tag(it.category, "#2b5cb8", "#eef4ff", "#c7dbff") : "",
    it.cluster ? tag(it.cluster, "#2b5cb8", "#eef4ff", "#c7dbff") : "",
    vt ? tag("🎬 " + vt, "var(--text-tertiary)", "var(--surface-card)", "var(--border)") : "",
    it.source ? tag("来源 " + it.source, "var(--text-tertiary)", "var(--surface-card)", "var(--border)") : "",
  ].filter(Boolean).join(" ");
  return `<div class="card" style="padding:12px">
    <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
      <span style="font-size:10px;color:${tone.c};background:${tone.bg};border:1px solid ${tone.bd};border-radius:4px;padding:1px 6px">${esc1(it.type || "🟡中性观察")}</span>
      ${level}
    </div>
    <div style="margin-top:7px;font-size:13px;line-height:1.7;white-space:pre-wrap;color:var(--text)">${esc1(it.content)}</div>
    ${metas ? `<div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap">${metas}</div>` : ""}
  </div>`;
}

function paintExperiences(){
  const bar = document.getElementById("expFilterBar");
  const list = document.getElementById("expList");
  if(!bar || !list) return;
  const chip = (key, label, n) => {
    const active = expType === key;
    return `<span data-exptype="${esc1(key)}" style="display:inline-block;padding:4px 11px;margin:3px 5px 3px 0;border-radius:14px;font-size:12px;cursor:pointer;${active ? "background:#2b5cb8;color:#fff" : "background:var(--surface-card);color:var(--text);border:1px solid var(--border)"}">${esc1(label)} ${n}</span>`;
  };
  const cnt = t => expItems.filter(x => x.type === t).length;
  bar.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
    <div style="line-height:2">${chip("", "全部", expItems.length)}${chip("✅加分行为", "✅加分", cnt("✅加分行为"))}${chip("❌减分行为", "❌减分", cnt("❌减分行为"))}${chip("🟡中性观察", "🟡中性", cnt("🟡中性观察"))}</div>
    <button id="expAddBtn" style="padding:5px 13px;font-size:12px;border:1px solid #c7dbff;border-radius:8px;background:#eef4ff;color:#2b5cb8;cursor:pointer;white-space:nowrap">✍️ 记经验</button>
  </div>`;
  bar.querySelectorAll("[data-exptype]").forEach(el => {
    el.onclick = () => { expType = el.getAttribute("data-exptype") || ""; paintExperiences(); };
  });
  document.getElementById("expAddBtn").onclick = openExpForm;

  const items = expType ? expItems.filter(x => x.type === expType) : expItems;
  if(!items.length){
    list.innerHTML = `<div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:40px 20px;line-height:1.8">${expItems.length ? "这个筛选下还没有经验" : "还没有经验卡片<br>写评价点「→ 经验」，或点「✍️ 记经验」开始积累"}</div>`;
    return;
  }
  list.innerHTML = items.map(expCardHtml).join("");
}

async function saveExpForm(){
  const ta = document.getElementById("expContent");
  const msg = document.getElementById("expFormMsg");
  const btn = document.getElementById("expSaveBtn");
  if(!ta || !msg || !btn) return;
  const text = ta.value.trim();
  if(!text){ msg.textContent = "内容为空"; return; }
  const type = (document.querySelector('input[name="expTypeOpt"]:checked') || {}).value || "🟡中性观察";
  const level = (document.querySelector('input[name="expLevelOpt"]:checked') || {}).value || "普通经验";
  btn.disabled = true; btn.textContent = "保存中…";
  try{
    const resp = await fetch(API_BASE + "/api/experience/add", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text, type, level, source: "手动记录" }),
    });
    const d = await resp.json();
    if(!d.ok) throw new Error(d.error || "保存失败");
    const wrap = document.getElementById("expFormWrap");
    if(wrap) wrap.innerHTML = "";
    await loadExperiences();
  }catch(e){
    msg.textContent = e.message;
    btn.disabled = false; btn.textContent = "保存";
  }
}

function renderInsight(){
  // 模块完成度柱状条
  const DONUT_COLORS=["var(--module-4)","var(--module-3)","var(--module-5)","var(--module-2)","var(--module-1)","var(--danger)","var(--text-tertiary)"];
  const bars = CONFIG.modules.map(m=>{
    const it=data[m.key]||[]; let pct=0, label="";
    if(m.type==="todo"){ const d=it.filter(x=>x.done).length; pct=it.length?Math.round(d/it.length*100):0; label=`${d}/${it.length}`; }
    else if(m.type==="checkin"){ const t=today(); const d=it.filter(x=>x.log&&x.log[t]).length; pct=it.length?Math.round(d/it.length*100):0; label=`${d}/${it.length}`; }
    else if(m.type==="progress"){ pct=avgProgress(it).value; label=`${pct}%`; }
    else if(m.type==="finance"){ const e=it.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0); label=`¥${e}`; }
    else { label=`${it.length} 条`; }
    return {m, pct, label};
  });
  const barAvg = bars.length ? Math.round(bars.reduce((s,b)=>s+b.pct,0)/bars.length) : 0;
  const barList = bars.map(b=>`<div class="bar-row" data-open="${b.m.key}" role="button" tabindex="0">
    <span class="bar-ic" style="color:${b.m.color}">${icon(b.m.icon,17)}</span>
    <span class="bar-name">${b.m.name}</span>
    <div class="pbar"><i style="width:${Math.min(100,b.pct)}%;background:${b.m.color}"></i></div>
    <span class="bar-pct">${b.label}</span></div>`).join("");

  // 支出构成 donut
  const money = data.money||[];
  const exps = money.filter(x=>x.type==="expense");
  const totalExp = exps.reduce((s,x)=>s+ +x.amount,0);
  const cats = (modOf("money")&&modOf("money").categories)||[];
  let segs = cats.map(c=>({ cat:c, amount: exps.filter(x=>x.category===c).reduce((s,x)=>s+ +x.amount,0) }))
    .filter(s=>s.amount>0).sort((a,b)=>b.amount-a.amount);
  segs.forEach((s,i)=>s.color=DONUT_COLORS[i%DONUT_COLORS.length]);
  const donut = segs.length ? donutSVG(segs) : `<div class="donut-empty">${icon("wallet",22)}<span>暂无</span></div>`;
  const legend = segs.map(s=>{ const p=totalExp?Math.round(s.amount/totalExp*100):0;
    return `<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>
      <span class="legend-name">${esc(s.cat)}</span><span class="legend-amt">¥${s.amount}</span><span class="legend-pct">${p}%</span></div>`; }).join("");

  $("#screen").innerHTML = `<div class="greet"><div><h1>洞察</h1><p>各模块进展一览 · 记录—执行—统计—反馈</p></div></div>
    <div class="sec-title">模块完成度</div>
    <div class="panel"><div class="ph">${icon("chart",15)} 模块完成度<span class="avg">均 ${barAvg}%</span></div>
      <div class="bar-list">${barList}</div></div>
    <div class="sec-title">支出构成</div>
    <div class="panel"><div class="ph">${icon("wallet",15)} 支出构成<span class="avg">合计 ¥${totalExp}</span></div>
      <div class="donut-wrap"><div class="donut">${donut}${segs.length?`<span class="donut-mid">¥${totalExp}</span>`:''}</div>
        <div class="donut-legend">${legend}</div></div></div>`;
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
}
